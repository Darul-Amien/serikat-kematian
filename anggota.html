<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07382a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Portal Anggota</title>
<style>
:root{--bg:#f3f7f5;--card:#fff;--text:#12281f;--muted:#5f7a6d;--line:#dfeae4;--pri:#0f6b4f;--pri2:#1f9a73;--h1:#07382a;--h2:#0f6b4f;--pri-soft:#e3f3ec;--onpri:#fff;--danger:#c8372d;--ok:#0f8a5f;--warn:#b7791f;--sh:0 2px 14px rgba(7,56,42,.08);--ring:rgba(15,107,79,.25)}
@media (prefers-color-scheme:dark){:root{--bg:#0a1511;--card:#112019;--text:#e4f1ea;--muted:#8fa89b;--line:#1f3328;--pri:#3dc592;--pri2:#79dfb7;--h1:#06261c;--h2:#0d4a38;--pri-soft:#143327;--onpri:#04241a;--danger:#f2766b;--ok:#4fd8a0;--warn:#e8b04a;--sh:0 2px 14px rgba(0,0,0,.4);--ring:rgba(61,197,146,.3)}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);letter-spacing:.005em}
h1,h2,h3{margin:0}h3{font-size:16px;font-weight:650}
button,input{font:inherit;color:inherit}
header{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 20px;border-radius:0 0 28px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5;box-shadow:0 4px 16px rgba(7,56,42,.25)}
header h1{font-size:19px}header small{opacity:.85;font-size:12px;display:block}
.hbtn{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:12px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
main{max-width:720px;margin:0 auto;padding:16px 14px 110px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.hero{background:radial-gradient(circle at 88% 12%,rgba(255,255,255,.16),transparent 42%),radial-gradient(circle at 6% 115%,rgba(255,255,255,.09),transparent 40%),linear-gradient(135deg,var(--h1),var(--h2));color:#fff;border-radius:24px;padding:22px 20px;margin-bottom:14px;box-shadow:0 8px 22px rgba(7,56,42,.28)}
.hero small{opacity:.85}.hero b{display:block;font-size:32px;margin:2px 0 8px;letter-spacing:-.01em}
.chip{display:inline-block;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 12px;font-size:13px}
.grid{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-bottom:14px}
.stat{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.stat small{font-size:12px;color:var(--muted)}.stat b{display:block;font-size:19px;margin-top:2px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.li{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0;padding-bottom:0}
.muted{color:var(--muted);font-size:14px}.in{color:var(--ok)}.out{color:var(--danger)}
.badge{display:inline-block;padding:1px 10px;border-radius:999px;font-size:12px;background:var(--pri-soft);color:var(--pri);font-weight:500}
.badge.bad{background:rgba(200,55,45,.12);color:var(--danger)}.badge.off{background:var(--line);color:var(--muted)}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--ring)}
.btn{display:block;width:100%;text-align:center;text-decoration:none;border-radius:12px;padding:12px 16px;cursor:pointer;border:1px solid var(--pri);font-size:15px;margin-top:10px}
.btn.primary{background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--onpri);border-color:transparent;box-shadow:0 4px 12px rgba(7,56,42,.22)}
.btn.ghost{background:transparent;color:var(--pri)}
.btn:disabled{opacity:.6}
.ferr{margin:10px 0 0;padding:8px 10px;border-radius:10px;background:rgba(200,55,45,.12);color:var(--danger);font-size:14px}.ferr:empty{display:none}
#login{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,var(--h1),var(--h2))}
#login .card{width:min(380px,100%);padding:22px}
.logo{width:52px;height:52px;border-radius:16px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;margin-bottom:10px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--pri2);border-radius:99px}
#bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(7,56,42,.1)}
#bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--muted);font-size:11px;padding:5px 0;cursor:pointer}
#bnav button.on{color:var(--pri);font-weight:600}
#bnav svg{width:24px;height:24px}
#bnav button.on svg{width:46px;height:30px;padding:3px 11px;box-sizing:border-box;background:var(--pri-soft);border-radius:999px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:20}
#toast.show{opacity:1}#toast.err{background:var(--danger);color:#fff}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:6px}
</style>
</head>
<body>

<section id="login" hidden>
  <form class="card" id="loginForm">
    <div class="logo" id="logo"></div>
    <h2 id="lbrand">Portal Anggota</h2>
    <p class="muted" style="margin:2px 0 0">Masuk untuk melihat tunggakan dan keadaan kas</p>
    <label for="ni">No. induk anggota</label>
    <input id="ni" autocomplete="username" autocapitalize="off" required>
    <label for="pin">PIN (6 angka)</label>
    <input id="pin" type="password" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="current-password" required>
    <p class="ferr" id="lerr" role="alert"></p>
    <button class="btn primary" type="submit" id="loginBtn">Masuk</button>
    <button class="btn ghost" type="button" id="lupa">Lupa PIN? Hubungi admin</button>
  </form>
</section>

<div id="app" hidden>
  <header>
    <div><small id="hno">Anggota</small><h1 id="hnama">-</h1></div>
    <button class="hbtn" id="logoutBtn" aria-label="Keluar"></button>
  </header>
  <main id="view"></main>
  <div id="bnav"></div>
</div>
<div id="toast" role="status"></div>

<script>
/* ============ KONFIGURASI ============ */
// URL Web App Apps Script yang sama dengan aplikasi admin (berakhiran /exec)
const API_URL = 'https://script.google.com/macros/s/AKfycbwbtIzhauLLo_XhctBvnMcBlpPK2Q7G7fSuqOzF-fwZu2OhxeiAbifXKaQDBXXACte1/exec';

const S = { token: null, d: null, tab: 'home', info: { namaSerikat: 'Serikat Kematian', waAdmin: '' } };
try { S.token = sessionStorage.getItem('mtok'); } catch (e) {}

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = n => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n || 0);
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const fmtP = p => { const [y, m] = String(p).split('-'); return BULAN[+m - 1] + ' ' + y; };
const fmtT = t => { if (!t) return '-'; const [y, m, d] = t.split('-'); return +d + ' ' + BULAN[+m - 1].slice(0, 3) + ' ' + y; };
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : ''); clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', err ? 5000 : 2200); }
function waNum(v) { let p = String(v || '').replace(/\D/g, ''); if (p.startsWith('0')) p = '62' + p.slice(1); return p; }

const ICONS = {
  home: '<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
  book: '<path d="M4 4h12a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/><path d="M8 9h7M8 13h7"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  leaf: '<path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15"/><path d="M5 19c3-5 6-7 10-9"/>'
};
const ic = (n, sz) => '<svg viewBox="0 0 24 24" width="' + (sz || 24) + '" height="' + (sz || 24) + '" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[n] + '</svg>';
const NAVS = [['home', 'Beranda', 'home'], ['kas', 'Kas', 'book'], ['riwayat', 'Riwayat', 'clock']];
$('#bnav').innerHTML = NAVS.map(n => '<button data-tab="' + n[0] + '">' + ic(n[2]) + '<span>' + n[1] + '</span></button>').join('');
$('#logoutBtn').innerHTML = ic('logout', 20);
$('#logo').innerHTML = ic('leaf', 28);

/* ============ API ============ */
async function api(action, payload) {
  let res;
  try { res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, token: S.token }, payload || {})) }); }
  catch (e) { throw new Error('Tidak bisa terhubung ke server. Periksa koneksi internet.'); }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('Respons server tidak valid. Coba lagi nanti.'); }
  if (!j.ok) { if (j.code === 'AUTH') logout(); throw new Error(j.error || 'Terjadi kesalahan'); }
  return j;
}

/* ============ LOGIN ============ */
function brand() { document.title = 'Portal Anggota · ' + S.info.namaSerikat; $('#lbrand').textContent = S.info.namaSerikat; }
function showLogin() { $('#app').hidden = true; $('#login').hidden = false; $('#pin').value = ''; }
function logout() { S.token = null; S.d = null; try { sessionStorage.removeItem('mtok'); } catch (e) {} showLogin(); }
$('#logoutBtn').onclick = logout;

$('#loginForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const btn = $('#loginBtn'), err = $('#lerr');
  err.textContent = ''; btn.disabled = true;
  try {
    const j = await api('memberLogin', { noInduk: $('#ni').value, pin: $('#pin').value });
    S.token = j.token; try { sessionStorage.setItem('mtok', j.token); } catch (e) {}
    await load();
  } catch (e) { err.textContent = e.message; } finally { btn.disabled = false; }
});

$('#lupa').onclick = () => {
  const w = waNum(S.info.waAdmin);
  if (!w) return toast('Nomor admin belum diatur. Hubungi pengurus secara langsung.', true);
  const ni = $('#ni').value.trim();
  const msg = 'Assalamu'alaikum ustadz admin ' + S.info.namaSerikat + ', ulun lupa PIN akun anggota' + (ni ? ' (No. induk: ' + ni + ')' : '') + '. Mohon bantu reset PIN ulun. Terima kasih.';
  window.open('https://wa.me/' + w + '?text=' + encodeURIComponent(msg), '_blank', 'noopener');
};

async function load() {
  const j = await api('memberGet'); S.d = j.data; S.info.namaSerikat = S.d.namaSerikat; S.info.waAdmin = S.d.waAdmin;
  $('#login').hidden = true; $('#app').hidden = false; brand(); render();
}

/* ============ TAMPILAN ============ */
function rangeP(m) { return fmtP(m[0]) + (m.length > 1 ? ' – ' + fmtP(m[m.length - 1]) : ''); }
const santBadge = s => '<span class="badge ' + (s === 'Lunas' ? '' : s === 'Belum' ? 'bad' : 'off') + '">' + esc(s) + '</span>';

function vHome() {
  const d = S.d, t = d.tunggakan, ok = t.total === 0, w = waNum(d.waAdmin);
  const msg = 'Halo Admin ' + d.namaSerikat + ', saya ' + d.nama + ' (No. induk ' + d.noInduk + ') ingin konfirmasi pembayaran.';
  return `<div class="hero"><small>Total tunggakan</small><b>${rp(t.total)}</b><span class="chip">${ok ? 'Lunas, terima kasih 🙏' : 'Mohon segera diselesaikan'}</span></div>
  <div class="card"><h3>Rincian</h3>
    <div class="li"><div>Iuran bulanan<div class="muted">${t.miss.length ? t.miss.length + ' bulan (' + esc(rangeP(t.miss)) + ')' : (d.status === 'Aktif' ? 'Semua bulan sudah lunas' : 'Status keanggotaan: ' + esc(d.status))}</div></div><b class="${t.iuran ? 'out' : ''}">${rp(t.iuran)}</b></div>
    <div class="li"><div>Santunan kematian<div class="muted">${t.santunan ? d.santunan.filter(x => x.Status === 'Belum').map(x => esc(x.Almarhum)).join(', ') : 'Tidak ada tagihan'}</div></div><b class="${t.santunan ? 'out' : ''}">${rp(t.santunan)}</b></div></div>
  <div class="card"><div class="row"><div><div class="muted">Saldo kas ${esc(d.namaSerikat)}</div><b style="font-size:20px">${rp(d.kas.saldo)}</b></div><button class="btn ghost" style="width:auto;margin:0" data-tab="kas">Lihat kas</button></div></div>
  ${w ? `<a class="btn primary" target="_blank" rel="noopener" href="https://wa.me/${w}?text=${encodeURIComponent(msg)}">Hubungi admin untuk pembayaran</a>` : ''}
  <p class="foot">Pembayaran dicatat oleh admin. Data diperbarui saat halaman dibuka.</p>`;
}

function vKas() {
  const k = S.d.kas, max = Math.max(1, ...k.perBulan.map(b => Math.max(b.masuk, b.keluar)));
  return `<div class="hero"><small>Saldo kas</small><b>${rp(k.saldo)}</b><span class="chip">${esc(S.d.namaSerikat)}</span></div>
  <div class="grid"><div class="stat"><small>Total uang masuk</small><b class="in">${rp(k.masuk)}</b></div><div class="stat"><small>Total uang keluar</small><b class="out">${rp(k.keluar)}</b></div></div>
  <div class="card"><h3>Per bulan</h3>${k.perBulan.length ? k.perBulan.map(b => `<div class="li" style="display:block"><div class="row"><b>${esc(fmtP(b.bulan))}</b><span class="muted">selisih ${rp(b.masuk - b.keluar)}</span></div>
    <div class="row muted"><span class="in">Masuk ${rp(b.masuk)}</span><span class="out">Keluar ${rp(b.keluar)}</span></div>
    <div class="bar"><i style="width:${Math.round(b.masuk / max * 100)}%"></i></div><div class="bar"><i style="width:${Math.round(b.keluar / max * 100)}%;background:var(--danger)"></i></div></div>`).join('') : '<p class="muted">Belum ada transaksi.</p>'}</div>`;
}

function vRiwayat() {
  const d = S.d;
  return `<div class="card"><h3>Riwayat iuran saya</h3>${d.riwayatIuran.length ? d.riwayatIuran.map(i => `<div class="li"><div>${esc(fmtP(i.Periode))}<div class="muted">Dibayar ${esc(fmtT(i.TanggalBayar))} · ${esc(i.Metode)}</div></div><b>${rp(i.Jumlah)}</b></div>`).join('') : '<p class="muted">Belum ada pembayaran tercatat.</p>'}</div>
  <div class="card"><h3>Santunan kematian</h3>${d.santunan.length ? d.santunan.map(x => `<div class="li"><div>${esc(x.Almarhum)}<div class="muted">${esc(fmtT(x.Tanggal))} · ${x.Jiwa} jiwa</div></div><div style="text-align:right"><b>${rp(x.Jumlah)}</b><div>${santBadge(x.Status)}</div></div></div>`).join('') : '<p class="muted">Belum ada tagihan santunan.</p>'}</div>`;
}

const VIEWS = { home: vHome, kas: vKas, riwayat: vRiwayat };
function render() {
  if (!S.d) return;
  $('#hnama').textContent = S.d.nama; $('#hno').textContent = 'No. induk ' + S.d.noInduk;
  document.querySelectorAll('#bnav button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  $('#view').innerHTML = VIEWS[S.tab]();
}
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-tab]'); if (!t) return;
  S.tab = t.dataset.tab; render(); window.scrollTo(0, 0);
});

/* ============ MULAI ============ */
api('memberInfo').then(j => { S.info = j.info; brand(); }).catch(() => {});
if (S.token) load().catch(() => showLogin()); else showLogin();
</script>
</body>
</html>
