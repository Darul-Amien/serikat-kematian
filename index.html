<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a8f6a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Serikat Kematian</title>
<style>
:root{--g:#0a9b6a;--g2:#0b7a8f;--b:#0e6ba8;--bg:#f2f6f9;--card:#fff;--tx:#17252e;--mu:#6a7b87;--ln:#e4ebf0;--red:#d64545;--redbg:#fdecec;--ok:#12844f;--okbg:#e3f6ec;--warn:#9a6a10;--warnbg:#fff4de;--sh:0 2px 10px rgba(16,50,70,.07);--nav:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#dfe7ec;color:var(--tx);font-size:15px;line-height:1.35;overscroll-behavior-y:contain}
button{font-family:inherit;font-size:inherit;color:inherit}
.hide{display:none!important}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:18px;height:18px}
#shell{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;box-shadow:0 0 30px rgba(0,0,0,.08)}
#bar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:3px;z-index:60;overflow:hidden;opacity:0;transition:opacity .2s}
#bar.on{opacity:1}
#bar::after{content:"";display:block;height:100%;width:40%;background:#fff;box-shadow:0 0 6px #fff;animation:slide 1s infinite ease-in-out}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}

/* ===== AUTH ===== */
.ahero{background:linear-gradient(135deg,var(--g),var(--g2) 60%,var(--b));color:#fff;text-align:center;padding:calc(36px + env(safe-area-inset-top)) 24px 80px;border-radius:0 0 32px 32px}
.logo{width:68px;height:68px;border-radius:20px;background:rgba(255,255,255,.18);display:grid;place-items:center;margin:0 auto 14px}
.logo .ic{width:38px;height:38px;stroke-width:1.8}
.ahero h1{margin:0 0 4px;font-size:22px}
.ahero p{margin:0;opacity:.85;font-size:14px}
.acard{background:var(--card);margin:-48px 16px 16px;border-radius:20px;padding:16px;box-shadow:var(--sh)}
.seg{display:flex;background:#eaf0f4;border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:9px;font-weight:600;color:var(--mu);min-height:42px}
.seg button.on{background:#fff;color:var(--g2);box-shadow:0 1px 4px rgba(0,0,0,.1)}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 5px;font-weight:600}
input,select,textarea{width:100%;padding:12px 13px;border:1.5px solid #d3dde4;border-radius:12px;font-size:16px;font-family:inherit;background:#fff;color:var(--tx);min-height:48px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--g)}
.pin{text-align:center;letter-spacing:.6em;font-size:24px}
.btn{border:0;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;min-height:48px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{filter:brightness(.92)}
.btn:disabled{opacity:.6}
.btn.block{width:100%}
.btn.out{background:#fff;color:var(--g2);border:1.5px solid #cfe0e7}
.btn.red{background:var(--red)}
.btn.wa{background:#1faa59}
.btn.sm{min-height:38px;padding:7px 12px;font-size:13px;border-radius:10px}
.msg{font-size:14px;margin:12px 0 0;color:var(--red);min-height:18px}
.msg.mu{color:var(--mu)}
.note{font-size:13px;color:var(--mu);margin:10px 0 0}

/* ===== HEADER ===== */
.hdr{background:linear-gradient(135deg,var(--g),var(--g2) 60%,var(--b));color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 58px;border-radius:0 0 28px 28px}
.hdr.cp{padding:calc(12px + env(safe-area-inset-top)) 12px 14px 12px;border-radius:0 0 20px 20px;display:flex;align-items:center;gap:6px}
.hdr .hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hdr small{opacity:.85;font-size:13px}
.hdr h1{margin:2px 0 0;font-size:20px}
.hdr.cp h1{font-size:18px;flex:1;margin:0 0 0 4px}
.ib{border:0;background:rgba(255,255,255,.18);color:#fff;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.ib.dark{background:#eaf0f4;color:var(--tx)}
#page{padding-bottom:calc(var(--nav) + 90px + env(safe-area-inset-bottom))}
.pad{padding:14px 16px}
.sumcard{background:var(--card);border-radius:20px;margin:-42px 16px 0;padding:16px;box-shadow:var(--sh)}
.sumcard .lbl{font-size:13px;color:var(--mu)}
.sumcard .big{font-size:28px;font-weight:800;margin:2px 0 10px}
.prog{height:9px;background:#e6eef3;border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--b));border-radius:6px}
.psub{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);margin-top:7px}
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:16px 10px 4px}
.mi{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:4px 0;cursor:pointer;color:var(--tx)}
.mi span{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:#fff;box-shadow:var(--sh);color:var(--g2)}
.mi:active span{transform:scale(.94)}
.mi.r span{color:var(--red)}.mi.o span{color:#c47d0a}.mi.b span{color:var(--b)}
.sec{display:flex;justify-content:space-between;align-items:center;margin:18px 16px 8px}
.sec h2{margin:0;font-size:16px}
.sec a{color:var(--g2);font-weight:600;font-size:13px;cursor:pointer;text-decoration:none}
.list{margin:0 16px;background:var(--card);border-radius:16px;box-shadow:var(--sh);overflow:hidden}
.pad .list{margin:0}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--ln);background:transparent;width:100%;text-align:left;cursor:pointer;min-height:64px}
.item:last-child{border-bottom:0}
.item:active{background:#f4f8fa}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#d9f1e8,#d6e8f5);color:var(--g2);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.item .mid{flex:1;min-width:0}
.item .mid b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .mid small{color:var(--mu);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .end{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.amt{font-weight:700;white-space:nowrap}
.in{color:var(--ok)}.out{color:var(--red)}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;background:#e8eef2;color:#52646f}
.badge.Aktif{background:var(--okbg);color:var(--ok)}
.badge.Wafat{background:#eee;color:#555}
.badge.tg{background:var(--redbg);color:var(--red)}
.badge.ok{background:var(--okbg);color:var(--ok)}
.empty{padding:28px 16px;text-align:center;color:var(--mu)}
.empty .ic{width:40px;height:40px;opacity:.5;margin-bottom:6px}
.search{position:relative;margin-bottom:10px}
.search .ic{position:absolute;left:13px;top:13px;color:var(--mu)}
.search input{padding-left:42px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1.5px solid #d3dde4;background:#fff;border-radius:20px;padding:7px 14px;font-weight:600;font-size:13.5px;white-space:nowrap;color:var(--mu);min-height:38px;cursor:pointer}
.chip.on{background:var(--g2);border-color:var(--g2);color:#fff}
.mn{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:16px;padding:8px;margin-bottom:12px;box-shadow:var(--sh)}
.mn b{font-size:16px}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--sh);margin-bottom:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--sh)}
.stat small{color:var(--mu);font-size:12.5px}
.stat b{display:block;font-size:17px;margin-top:3px}
.bars{display:flex;align-items:flex-end;gap:5px;height:130px;margin:10px 0 4px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--mu);gap:4px}
.bars i{display:block;width:100%;background:linear-gradient(180deg,var(--g),var(--b));border-radius:5px 5px 2px 2px;min-height:2px}
.row2{display:flex;gap:8px}
.row2>*{flex:1}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--ln);gap:12px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--mu)}
.kv b{text-align:right}

/* ===== NAV + FAB ===== */
#mnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--ln);display:flex;z-index:30;box-shadow:0 -4px 16px rgba(16,50,70,.06)}
#mnav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--mu);cursor:pointer}
#mnav button.on{color:var(--g2)}
#mnav button.on .ic{stroke-width:2.4}
#fabw{position:fixed;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 14px);left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;justify-content:flex-end;padding:0 16px;pointer-events:none;z-index:25}
.fab{pointer-events:auto;border:0;background:linear-gradient(135deg,var(--g),var(--b));color:#fff;border-radius:28px;padding:0 20px 0 16px;height:54px;display:flex;align-items:center;gap:8px;font-weight:700;box-shadow:0 6px 18px rgba(11,122,143,.4);cursor:pointer}
#toast{position:fixed;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 76px);left:50%;transform:translateX(-50%);background:#1d2b33;color:#fff;padding:11px 18px;border-radius:12px;display:none;z-index:90;max-width:88vw;font-size:14px;text-align:center}

/* ===== SHEET ===== */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:480px;max-height:92dvh;border-radius:24px 24px 0 0;overflow:auto;background:#fff;color:var(--tx);animation:up .22s ease}
dialog.sheet::backdrop{background:rgba(10,30,40,.5)}
@keyframes up{from{transform:translateY(60px);opacity:.4}}
.grab{width:42px;height:5px;border-radius:3px;background:#d3dde4;margin:10px auto 0}
.shh{display:flex;justify-content:space-between;align-items:center;padding:8px 18px 0}
.shh h3{margin:6px 0;font-size:18px}
#shB{padding:4px 18px calc(18px + env(safe-area-inset-bottom))}
.actions{display:flex;gap:10px;margin-top:18px}
.actions .btn{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}

/* ===== KARTU ANGGOTA ===== */
.idcard{border-radius:20px;color:#fff;padding:18px;background:radial-gradient(circle at 100% 0,rgba(255,255,255,.22) 0 90px,transparent 91px),radial-gradient(circle at 0 100%,rgba(255,255,255,.12) 0 110px,transparent 111px),linear-gradient(135deg,var(--g),var(--g2) 60%,var(--b));box-shadow:0 8px 22px rgba(11,122,143,.3)}
.idcard .t{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.12em;opacity:.9;font-weight:700}
.idcard .n{font-size:26px;font-weight:800;letter-spacing:.06em;margin:16px 0 2px}
.idcard .nm{font-size:16px;font-weight:600;text-transform:uppercase}
.idcard .r{display:flex;gap:20px;margin-top:16px}
.idcard small{display:block;opacity:.8;font-size:11px}
.idcard .r b{font-size:14px}
.stbox{border-radius:16px;padding:14px;margin-top:14px}
.stbox.ok{background:var(--okbg);color:var(--ok)}
.stbox.bad{background:var(--redbg);color:var(--red)}
.stbox.mu{background:#eceff1;color:#52646f}
.stbox b{display:block;font-size:16px;margin-bottom:3px}
</style>
</head>
<body>

<div id="bar"></div>
<div id="shell">

<!-- ===== AUTH ===== -->
<div id="auth">
  <div class="ahero">
    <div class="logo"><svg class="ic"><use href="#i-shield"/></svg></div>
    <h1 id="aName">Serikat Kematian</h1>
    <p>Iuran &amp; santunan, transparan dan mudah</p>
  </div>
  <div class="acard">
    <div class="seg">
      <button id="tCek" class="on" onclick="authTab('cek')">Cek Kepesertaan</button>
      <button id="tAdm" onclick="authTab('adm')">Pengurus</button>
    </div>
    <div id="pCek">
      <label for="cNo">Nomor Anggota</label>
      <input id="cNo" placeholder="contoh: SK-0001" autocapitalize="characters" autocomplete="off">
      <label for="cWa">Kode rahasia (6 karakter)</label>
      <input id="cWa" maxlength="6" placeholder="contoh: K7M2QX" autocapitalize="characters" autocomplete="off">
      <div style="margin-top:16px"><button class="btn block" onclick="doCek()">Cek Status Saya</button></div>
      <p class="msg" id="cekErr"></p>
      <p class="note">Nomor dan kode rahasia dikirim pengurus. Tanyakan kepada pengurus bila belum menerimanya.</p>
    </div>
    <div id="pAdm" class="hide">
      <label for="pin">PIN Pengurus</label>
      <input id="pin" class="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••••">
      <div style="margin-top:16px"><button class="btn block" onclick="doLogin()">Masuk</button></div>
      <p class="msg" id="admErr"></p>
    </div>
  </div>
</div>

<!-- ===== HASIL CEK KEPESERTAAN ===== -->
<div id="cek" class="hide">
  <div class="hdr cp"><button class="ib" onclick="showScreen('auth')" aria-label="Kembali"><svg class="ic"><use href="#i-left"/></svg></button><h1>Status Kepesertaan</h1></div>
  <div class="pad" id="cekBody"></div>
</div>

<!-- ===== APLIKASI PENGURUS ===== -->
<div id="app" class="hide">
  <div id="hdr"></div>
  <div id="page"></div>
  <div id="fabw"></div>
  <nav id="mnav">
    <button data-v="beranda" onclick="go('beranda')"><svg class="ic"><use href="#i-home"/></svg>Beranda</button>
    <button data-v="anggota" onclick="go('anggota')"><svg class="ic"><use href="#i-users"/></svg>Anggota</button>
    <button data-v="iuran" onclick="go('iuran')"><svg class="ic"><use href="#i-receipt"/></svg>Iuran</button>
    <button data-v="kas" onclick="go('kas')"><svg class="ic"><use href="#i-wallet"/></svg>Kas</button>
    <button data-v="akun" onclick="go('akun')"><svg class="ic"><use href="#i-user"/></svg>Akun</button>
  </nav>
</div>

</div><!-- /shell -->

<dialog id="dlg" class="sheet">
  <div class="grab"></div>
  <div class="shh"><h3 id="shT"></h3><button class="ib dark" onclick="closeSheet()" aria-label="Tutup"><svg class="ic"><use href="#i-x"/></svg></button></div>
  <div id="shB"></div>
</dialog>
<div id="toast"></div>

<script>
/* ============ GANTI DENGAN URL WEB APP GAS ANDA (berakhiran /exec) ============ */
const API_URL = 'https://script.google.com/macros/s/AKfycbzayXGaw8GHF2lU4AFMDQjOhmAX8uPd7kyQ819lHqpdWyxZdgOoG66lFL1t-xX5-dFh/exec';
/* ============================================================================== */

const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const MAIN=['beranda','anggota','iuran','kas','akun'];
const VIEWS=MAIN.concat(['tunggakan','laporan','santunan']);

/* ---------- util ---------- */
const $=id=>document.getElementById(id);
const rp=n=>'Rp '+new Intl.NumberFormat('id-ID').format(Number(n)||0);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const bl=(b,t)=>BLN[b-1]+' '+t;

/* ---------- API ---------- */
async function api(action,payload={}){
  if(API_URL.includes('GANTI_DENGAN'))throw new Error('API_URL di index.html belum diganti dengan URL web app GAS (yang berakhiran /exec).');
  busy(1);
  try{
    const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),30000);
    let res;
    try{
      res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,token},payload)),signal:ctl.signal});
    }catch(e){
      throw new Error(e.name==='AbortError'?'Server lama merespons, coba lagi.':(navigator.onLine?'Tidak bisa terhubung ke server. Pastikan deploy GAS: Execute as "Me", akses "Anyone", URL berakhiran /exec.':'Tidak ada koneksi internet.'));
    }finally{clearTimeout(to);}
    let j;
    try{j=JSON.parse(await res.text());}
    catch(e){throw new Error('Server tidak mengembalikan JSON. Cek URL /exec dan deploy ulang sebagai versi baru.');}
    if(j.auth===false){logout(true);toast(j.error);throw new Error(j.error);}
    if(!j.ok)throw new Error(j.error||'Terjadi kesalahan');
    return j;
  }finally{busy(-1);}
}
async function reload(){
  const j=await api('getAll');
  S=Object.assign(emptyS(),j.data);lastLoad=Date.now();
  ls.set('sk_cache',S);
  if(S.pengaturan['Nama Serikat'])ls.set('sk_name',S.pengaturan['Nama Serikat']);
}

/* ---------- login pengurus ---------- */
async function doLogin(){
  const pin=$('pin').value.trim(),err=$('admErr');
  err.className='msg';err.textContent='';
  if(!pin){err.textContent='Isi PIN dulu.';return;}
  err.className='msg mu';err.textContent='Memeriksa…';
  try{
    const j=await api('login',{pin});
    token=j.token;ls.set('sk_token',token);
    await reload();
    $('pin').value='';err.textContent='';
    enterApp();
    if(j.ganti){go('akun');toast('PIN masih bawaan. Ganti dulu di menu Akun.');}
  }catch(e){err.className='msg';err.textContent=e.message;}
}
function enterApp(){
  showScreen('app');
  const h=location.hash.slice(1);
  view=VIEWS.includes(h)?h:'beranda';
  history.replaceState({v:view},'','#'+view);
  render();
}
function logout(silent){
  if(!silent&&token)api('logout').catch(()=>{});
  token='';ls.del('sk_token');ls.del('sk_cache');S=emptyS();
  closeSheet();showScreen('auth');authTab(silent?'adm':'cek');
  history.replaceState(null,'',location.pathname);
  if(!silent)toast('Anda telah keluar');
}

/* ---------- navigasi ---------- */
function go(v){
  const sub=!MAIN.includes(v);
  if(v===view&&!sub){render();return;}
  view=v;
  if(sub)history.pushState({v},'','#'+v);else history.replaceState({v},'','#'+v);
  render();window.scrollTo(0,0);
}
function back(){if(history.length>1)history.back();else go('beranda');}
window.addEventListener('popstate',e=>{
  if($('app').classList.contains('hide'))return;
  const v=(e.state&&e.state.v)||location.hash.slice(1)||'beranda';
  view=VIEWS.includes(v)?v:'beranda';render();
});
function setHdr(html,cls=''){$('hdr').innerHTML=`<div class="hdr ${cls}">${html}</div>`;}
function cpHdr(title,withBack){
  setHdr(`${withBack?`<button class="ib" onclick="back()" aria-label="Kembali">${ic('left')}</button>`:''}<h1 ${withBack?'':'style="margin-left:6px"'}>${esc(title)}</h1><button class="ib" onclick="doRefresh()" aria-label="Muat ulang">${ic('refresh')}</button>`,'cp');
}

const nm=()=>S.pengaturan['Nama Serikat']||ls.get('sk_name','Serikat Kematian');
const iuranBln=()=>Number(S.pengaturan['Iuran Bulanan'])||0;
const santunanDef=()=>Number(S.pengaturan['Santunan Kematian'])||0;
const ym=(b,t)=>t+'-'+pad(b);
function joinedBy(a,b,t){const m=String(a['Tanggal Masuk']||'').slice(0,7);return !m||m<=ym(b,t);}
function paidIds(b,t){return new Set(S.iuran.filter(i=>Number(i.Bulan)===b&&Number(i.Tahun)===t).map(i=>i['ID Anggota']));}
function belumBayar(b,t){const p=paidIds(b,t);return S.anggota.filter(a=>a.Status==='Aktif'&&joinedBy(a,b,t)&&!p.has(a.ID));}
function sudahBayar(b,t){return S.iuran.filter(i=>Number(i.Bulan)===b&&Number(i.Tahun)===t);}
function saldo(){let m=0,k=0;S.kas.forEach(x=>{if(x.Jenis==='Masuk')m+=Number(x.Jumlah);else k+=Number(x.Jumlah);});return{masuk:m,keluar:k,saldo:m-k};}
function menunggak(){return S.anggota.filter(a=>a.Status==='Aktif'&&(a._t||[]).length).sort((x,y)=>y._t.length-x._t.length);}
const tgText=a=>(a._t||[]).map(x=>bl(x.bulan,x.tahun)).join(', ');
function remindText(a,b,t){
  const list=(a._t&&a._t.length)?tgText(a):bl(b,t);
  const n=(a._t&&a._t.length)?a._t.length:1;
  return `Assalamualaikum ${a.Nama}, mengingatkan iuran ${nm()} yang belum terbayar: ${list}. Total ${rp(n*iuranBln())}. Terima kasih 🙏`;
}
function shiftM(st,d){st.b+=d;if(st.b<1){st.b=12;st.t--;}if(st.b>12){st.b=1;st.t++;}}
function mnav(st,fn){return `<div class="mn"><button class="ib dark" onclick="${fn}(-1)" aria-label="Bulan sebelumnya">${ic('left')}</button><b>${BULAN[st.b-1]} ${st.t}</b><button class="ib dark" onclick="${fn}(1)" aria-label="Bulan berikutnya">${ic('right')}</button></div>`;}
const empty=(icon,t)=>`<div class="empty">${ic(icon)}<div>${esc(t)}</div></div>`;

/* ---------- sheet ---------- */
function sheet(title,body){$('shT').textContent=title;$('shB').innerHTML=body;const d=$('dlg');if(!d.open)d.showModal();}
function closeSheet(){const d=$('dlg');if(d.open)d.close();}
$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))closeSheet();});
function fieldHtml(f){
  const v=f.value==null?'':f.value;let inp;
  if(f.type==='select')inp=`<select name="${f.k}">${f.options.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(v)?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
  else if(f.type==='textarea')inp=`<textarea name="${f.k}" rows="2">${esc(v)}</textarea>`;
  else inp=`<input name="${f.k}" type="${f.type||'text'}" value="${esc(v)}" ${f.type==='number'?'inputmode="numeric" min="0"':''} ${f.type==='tel'?'inputmode="tel"':''}>`;
  return `<label>${esc(f.label)}</label>${inp}${f.hint?`<p class="note" style="margin:4px 0 0">${esc(f.hint)}</p>`:''}`;
}
function openForm(title,fields,onSubmit,label='Simpan'){
  sheet(title,`<form id="frm" autocomplete="off">${fields.map(fieldHtml).join('')}<p class="msg" id="frmErr"></p><div class="actions"><button type="button" class="btn out" onclick="closeSheet()">Batal</button><button class="btn" id="frmOk">${esc(label)}</button></div></form>`);
  $('frm').onsubmit=async ev=>{
    ev.preventDefault();
    const data={};new FormData($('frm')).forEach((v,k)=>data[k]=v);
    const ok=$('frmOk');ok.disabled=true;ok.textContent='Menyimpan…';
    try{const msg=await onSubmit(data);closeSheet();await reload();render();toast(msg||'Tersimpan');}
    catch(e){$('frmErr').textContent=e.message;ok.disabled=false;ok.textContent=label;}
  };
}
function ask(title,msg,label,fn){
  sheet(title,`<p style="margin:6px 0 0">${esc(msg)}</p><p class="msg" id="askErr"></p><div class="actions"><button class="btn out" onclick="closeSheet()">Batal</button><button class="btn red" id="askOk">${esc(label)}</button></div>`);
  $('askOk').onclick=async()=>{
    const b=$('askOk');b.disabled=true;b.textContent='Memproses…';
    try{await fn();closeSheet();await reload();render();toast('Berhasil');}
    catch(e){$('askErr').textContent=e.message;b.disabled=false;b.textContent=label;}
  };
}

function setAF(f){fAng.f=f;listAnggota();}
function listAnggota(){
  const A=S.anggota,cnt={semua:A.length,aktif:A.filter(a=>a.Status==='Aktif').length,nunggak:menunggak().length,lain:A.filter(a=>a.Status!=='Aktif').length};

  const q=fAng.q.toLowerCase();
  const l=A.filter(a=>{
    if(q&&!(String(a.Nama).toLowerCase().includes(q)||String(a['No Anggota']).toLowerCase().includes(q)||String(a.WA).includes(q)))return false;
    if(fAng.f==='aktif')return a.Status==='Aktif';
    if(fAng.f==='nunggak')return a.Status==='Aktif'&&(a._t||[]).length>0;
    if(fAng.f==='lain')return a.Status!=='Aktif';
    return true;

}

  </form></div>
  <div class="card"><b>Cek Kepesertaan untuk Anggota</b><p class="note" style="margin:6px 0 12px">Bagikan tautan ini ke anggota. Mereka bisa cek status iuran sendiri dengan nomor anggota dan 4 digit akhir WhatsApp.</p>
    <div class="row2"><button class="btn out sm" onclick="copyLink()">${ic('copy','sm')} Salin tautan</button><a class="btn wa sm" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('Cek status iuran '+nm()+' di sini: '+link)}" style="text-decoration:none">${ic('share','sm')} Bagikan</a></div></div>
  ${deferredInstall?`<button class="btn out block" style="margin-bottom:12px" onclick="installApp()">${ic('download','sm')} Pasang aplikasi di HP</button>`:''}
  <button class="btn out block" onclick="logout()">${ic('logout','sm')} Keluar</button>
  <p class="note" style="text-align:center;margin-top:14px">Serikat Kematian v2 · sesi login berlaku 6 jam</p></div>`;
  $('fSet').onsubmit=async ev=>{
    ev.preventDefault();
    const d={};new FormData($('fSet')).forEach((v,k)=>d[k]=v);
    const ok=$('setOk');ok.disabled=true;ok.textContent='Menyimpan…';$('setErr').textContent='';
    try{await api('savePengaturan',{data:d});await reload();render();toast('Pengaturan tersimpan');}
    catch(e){$('setErr').textContent=e.message;ok.disabled=false;ok.textContent='Simpan Pengaturan';}
  };
}
async function copyLink(){
  const l=location.href.split('#')[0];
  try{await navigator.clipboard.writeText(l);toast('Tautan disalin');}catch(e){toast(l);}
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(view==='akun'&&!$('app').classList.contains('hide'))vAkun();});
async function installApp(){if(!deferredInstall)return;deferredInstall.prompt();try{await deferredInstall.userChoice;}catch(e){}deferredInstall=null;if(view==='akun')vAkun();}

function pinCard(){
  return S.wajibGantiPin?`<div class="card" style="margin:14px 16px 0;background:var(--redbg);color:var(--red)"><b>PIN masih bawaan</b><p class="note" style="margin:4px 0 10px;color:inherit">Ganti PIN agar data serikat aman.</p><button class="btn red sm" onclick="go('akun')">Ganti PIN</button></div>`:'';
}
function batalKj(id){ask('Batalkan kejadian wafat?','Semua tagihan, pembayaran, dan pencairan santunan kejadian ini dihapus, saldo kas dikoreksi, dan data anggota dipulihkan.','Batalkan',()=>api('hapusKejadian',{id}));}

/* ---------- mulai ---------- */
$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
$('cWa').addEventListener('keydown',e=>{if(e.key==='Enter')doCek();});
$('cNo').addEventListener('keydown',e=>{if(e.key==='Enter')$('cWa').focus();});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&token&&!$('app').classList.contains('hide')&&Date.now()-lastLoad>120000){reload().then(render).catch(()=>{});}
});
(function init(){
  setName(ls.get('sk_name',''));
  const lastNo=ls.get('sk_no','');if(lastNo)$('cNo').value=lastNo;
  api('info').then(j=>{const n=j.data['Nama Serikat'];if(n){ls.set('sk_name',n);setName(n);}}).catch(()=>{});
  if(token){
    const hasCache=S.anggota.length||S.kas.length||Object.keys(S.pengaturan).length;
    if(hasCache){
      enterApp();
      reload().then(render).catch(e=>{if(token)toast(navigator.onLine?e.message:'Mode offline: menampilkan data terakhir');});
    }else{
      reload().then(enterApp).catch(()=>{if(token)logout(true);});
    }
  }
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(()=>{});}
})();
</script>
</body>
