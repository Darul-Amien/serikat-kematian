<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f6b4f">
<title>Administrasi Serikat Kematian</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--text:#12281f;--muted:#5f7a6d;--line:#e2ece7;--pri:#0f6b4f;--pri2:#1f9a73;--h1:#07382a;--h2:#0f6b4f;--pri-soft:#e3f3ec;--onpri:#fff;--danger:#c8372d;--ok:#0f8a5f;--sh:0 4px 20px rgba(7,56,42,.06)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
h1,h2,h3{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
header{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;padding:18px 20px;border-radius:0 0 24px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;box-shadow:0 4px 20px rgba(7,56,42,.15)}
header h1{font-size:18px;font-weight:700}
header small{opacity:.85;font-size:11px;text-transform:uppercase;letter-spacing:.05em;display:block}
main{max-width:1100px;margin:0 auto;padding:20px 16px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:var(--sh)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh)}
.stat small{color:var(--muted);font-weight:500}
.stat b{display:block;font-size:24px;margin-top:4px;color:var(--h1)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end;margin-top:16px}
.row.between{justify-content:space-between}
button.primary,button.ghost,button.danger{border-radius:12px;padding:9px 18px;cursor:pointer;border:1px solid var(--pri);font-size:14px;font-weight:600;transition:all .2s}
button.primary{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(15,107,79,.25)}
button.ghost{background:transparent;color:var(--pri)}
button.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
input,select{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:14px}
input:focus,select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(15,107,79,.15)}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px;font-weight:500}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--pri-soft)}
td.n,th.n{text-align:right}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;background:var(--pri-soft);color:var(--pri)}
.badge.off{background:var(--line);color:var(--muted)}
.in{color:var(--ok);font-weight:600}.out{color:var(--danger);font-weight:600}
.muted{color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.ferr{margin:10px 0 0;padding:10px;border-radius:8px;background:rgba(200,55,45,.1);color:var(--danger);font-size:13px}
.ferr:empty{display:none}
dialog{border:none;border-radius:20px;padding:24px;width:min(500px,92vw);background:var(--card);color:var(--text);box-shadow:0 10px 40px rgba(0,0,0,.2)}
dialog::backdrop{background:rgba(0,0,0,.5);backdrop-filter:blur(2px)}

/* LOGIN */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:linear-gradient(150deg,var(--h1),var(--h2))}
.login-header{text-align:center;color:#fff;margin-bottom:24px}
.login-header h2{font-size:26px;font-weight:700}
.login-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;width:min(640px,100%)}
.login-card{background:var(--card);border-radius:22px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.2);display:flex;flex-direction:column;justify-content:space-between}

#toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;font-weight:500;box-shadow:0 5px 15px rgba(0,0,0,.2)}
#toast.show{opacity:1}#toast.err{background:var(--danger);color:#fff}
#bar{position:fixed;top:0;left:0;height:3px;width:100%;background:var(--pri2);z-index:30;display:none}

.hero{background:linear-gradient(135deg,var(--h1),var(--h2));border-radius:22px;padding:24px;color:#fff;margin-bottom:16px;box-shadow:0 8px 24px rgba(7,56,42,.2)}
.hero small{opacity:.8;font-size:13px}
.hero b{display:block;font-size:32px;margin:4px 0;letter-spacing:-.02em}

/* BOTTOM NAVIGATION STYLING */
#bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);padding:8px 6px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(7,56,42,.08);border-top:1px solid var(--line)}
#bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--muted);font-size:11px;font-weight:500;padding:6px 0;cursor:pointer;transition:color .2s}
#bnav button.on{color:var(--pri);font-weight:650}
#bnav button svg{width:22px;height:22px;stroke-width:1.8}
#bnav button.on svg{stroke:var(--pri)}
</style>
</head>
<body>
<div id="bar"></div>

<section id="login" hidden>
  <div class="login-header">
    <h2>Serikat Kematian</h2>
    <p style="opacity:.85;font-size:14px;margin-top:6px">Sistem Administrasi & Keuangan Terpadu</p>
  </div>
  <div class="login-cards">
    <div class="login-card">
      <div>
        <h3>Portal Pengurus</h3>
        <p class="muted" style="font-size:13px;margin:8px 0 16px">Kelola data anggota, pencatatan iuran, mutasi kas, dan klaim santunan.</p>
      </div>
      <button class="primary" data-act="openLoginAdmin">Masuk Pengurus</button>
    </div>
    <div class="login-card">
      <div>
        <h3>Portal Peserta</h3>
        <p class="muted" style="font-size:13px;margin:8px 0 16px">Cek status keaktifan, histori pembayaran iuran, dan rincian santunan.</p>
      </div>
      <button class="ghost" data-act="openLoginPeserta">Masuk Peserta</button>
    </div>
  </div>
</section>

<div id="app" hidden>
  <header>
    <div><small id="roleLbl">Pengurus</small><h1 id="brand">Serikat Kematian</h1></div>
    <button class="ghost" id="logoutBtn" data-act="logout" style="color:#fff;border-color:rgba(255,255,255,.3);padding:6px 12px;font-size:13px">Keluar</button>
  </header>
  <main id="view"></main>
  <div id="bnav"></div>
</div>

<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwbtIzhauLLo_XhctBvnMcBlpPK2Q7G7fSuqOzF-fwZu2OhxeiAbifXKaQDBXXACte1/exec';

const S = { token: sessionStorage.getItem('tok'), role: sessionStorage.getItem('role') || 'admin', data: null, tab: 'dashboard' };

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = n => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n || 0);
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const thisMonth = () => today().slice(0, 7);
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const fmtPeriode = p => { if (!p) return '-'; const arr = String(p).split('-'); return BULAN[+arr[1] - 1] + ' ' + arr[0]; };
const fmtTgl = t => { if (!t) return '-'; const arr = String(t).split('T')[0].split('-'); return +arr[2] + ' ' + BULAN[+arr[1] - 1].slice(0, 3) + ' ' + arr[0]; };

function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', err ? 5000 : 2200);
}
const bar = on => { $('#bar').style.display = on ? 'block' : 'none'; };

const ICONS = {
  dashboard: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  tagih: '<rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>',
  anggota: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  santunan: '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>',
  kas: '<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>'
};

const NAVS = [
  ['dashboard', 'Beranda', ICONS.dashboard], 
  ['tagih', 'Tagih', ICONS.tagih], 
  ['anggota', 'Anggota', ICONS.anggota], 
  ['santunan', 'Santunan', ICONS.santunan], 
  ['kas', 'Kas', ICONS.kas]
];

async function api(action, payload) {
  if (!API_URL) throw new Error('API_URL belum diisi.');
  let res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, token: S.token }, payload || {})) });
  let j = await res.json();
  if (!j.ok) { if (j.code === 'AUTH') logout(); throw new Error(j.error || 'Terjadi kesalahan'); }
  return j;
}

document.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  
  if (act === 'openLoginAdmin') {
    const d = $('#dlg');
    d.innerHTML = '<h3>Login Pengurus</h3><p class="muted" style="margin:4px 0 14px">Masukkan password pengurus</p><form id="formAdmin"><label>Password</label><input id="pwAdmin" type="password" required><p class="ferr" id="errAdmin"></p><div class="row end" style="margin-top:16px"><button type="button" class="ghost" onclick="$(\'#dlg\').close()">Batal</button><button class="primary" type="submit">Masuk</button></div></form>';
    d.showModal();
    $('#pwAdmin').focus();
    $('#formAdmin').onsubmit = async ev => {
      ev.preventDefault();
      try {
        const j = await api('login', { password: $('#pwAdmin').value });
        S.token = j.token; S.role = 'admin';
        sessionStorage.setItem('tok', j.token); sessionStorage.setItem('role', 'admin');
        d.close(); boot();
      } catch (ex) { $('#errAdmin').textContent = ex.message; }
    };
  }
  
  if (act === 'openLoginPeserta') {
    const d = $('#dlg');
    d.innerHTML = '<h3>Login Peserta</h3><p class="muted" style="margin:4px 0 14px">Masukkan No. Induk dan PIN Anda</p><form id="formPeserta"><label>No. Induk / No. HP</label><input id="noPeserta" type="text" required><label>PIN (6 Digit)</label><input id="pinPeserta" type="password" required><p class="ferr" id="errPeserta"></p><div class="row end" style="margin-top:16px"><button type="button" class="ghost" onclick="$(\'#dlg\').close()">Batal</button><button class="primary" type="submit">Masuk Portal</button></div></form>';
    d.showModal();
    $('#noPeserta').focus();
    $('#formPeserta').onsubmit = async ev => {
      ev.preventDefault();
      try {
        const j = await api('memberLogin', { noInduk: $('#noPeserta').value, pin: $('#pinPeserta').value });
        S.token = j.token; S.role = 'peserta';
        sessionStorage.setItem('tok', j.token); sessionStorage.setItem('role', 'peserta');
        d.close(); boot();
      } catch (ex) { $('#errPeserta').textContent = ex.message; }
    };
  }

  if (act === 'logout') logout();
});

document.addEventListener('click', e => {
  const btn = e.target.closest('#bnav button[data-tab]');
  if (!btn) return;
  S.tab = btn.dataset.tab;
  document.querySelectorAll('#bnav button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  render();
});

function showLogin() { 
  sessionStorage.clear();
  $('#app').hidden = true; 
  $('#login').hidden = false; 
}
function logout() { showLogin(); }

async function boot() {
  bar(true);
  try {
    if (S.role === 'admin') {
      const j = await api('getAll'); 
      S.data = j.data; S.tab = 'dashboard';
      $('#bnav').innerHTML = NAVS.map(n => '<button data-tab="' + n[0] + '" class="' + (S.tab === n[0] ? 'on' : '') + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">' + n[2] + '</svg><span>' + n[1] + '</span></button>').join('');
    } else {
      const j = await api('memberGet');
      S.data = j.data; S.tab = 'pesertaNav';
      $('#bnav').innerHTML = '<button data-tab="pesertaNav" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">' + ICONS.anggota + '</svg><span>Status Saya</span></button>';
    }
    $('#login').hidden = true; $('#app').hidden = false;
    $('#roleLbl').textContent = S.role === 'admin' ? 'Pengurus' : 'Peserta';
    render();
  } catch (e) {
    toast(e.message, true);
    showLogin();
  } finally { bar(false); }
}

const iurBulanan = () => (S.data && S.data.pengaturan) ? +S.data.pengaturan.IuranBulanan : 0;
const saldoKas = () => (S.data && S.data.kas) ? S.data.kas.reduce((s, k) => s + (k.Jenis === 'Masuk' ? k.Jumlah : -k.Jumlah), 0) : 0;

function render() {
  const v = $('#view');
  if (!S.data) return;
  
  if (S.role === 'peserta') { 
    v.innerHTML = '<div class="card"><h3>Halo, ' + esc(S.data.nama) + '</h3><p class="muted">No. Induk: ' + esc(S.data.noInduk) + ' | Status: <span class="badge">' + esc(S.data.status) + '</span></p></div>' +
                  '<div class="grid"><div class="stat"><small>Total Tunggakan</small><b class="out">' + rp(S.data.tunggakan.total) + '</b></div><div class="stat"><small>Saldo Kas Organisasi</small><b>' + rp(S.data.kas.saldo) + '</b></div></div>'; 
    return; 
  }
  
  if (S.tab === 'dashboard') {
    const aktif = S.data.anggota.filter(a => a.Status === 'Aktif').length;
    const terkumpul = S.data.iuran.filter(i => i.Periode === thisMonth()).reduce((s, i) => s + i.Jumlah, 0);
    v.innerHTML = '<div class="hero"><small>Saldo Kas Organisasi</small><b>' + rp(saldoKas()) + '</b><div style="margin-top:8px;font-size:13px;opacity:.9"><b>' + aktif + '</b> KK Aktif &bull; Iuran Terkumpul Bulan Ini: <b>' + rp(terkumpul) + '</b></div></div>' +
                  '<div class="card"><h3>Ringkasan Sistem</h3><p class="muted" style="margin-top:6px">Gunakan menu navigasi di bawah untuk mengelola data anggota, pengecekan tagihan, dan laporan keuangan kas secara real-time.</p></div>';
  } else if (S.tab === 'anggota') {
    v.innerHTML = '<div class="card"><div class="row between" style="margin-bottom:12px"><h3>Daftar Anggota (' + S.data.anggota.length + ')</h3></div>' +
                  '<div class="tw"><table><thead><tr><th>Nama / No. Induk</th><th>Tanggungan</th><th>Status</th></tr></thead><tbody>' +
                  S.data.anggota.map(a => '<tr><td><b>' + esc(a.Nama) + '</b><br><small class="muted">' + esc(a.NoInduk || '-') + '</small></td><td>' + a.Tanggungan + ' Jiwa</td><td><span class="badge ' + (a.Status === 'Aktif' ? '' : 'off') + '">' + esc(a.Status) + '</span></td></tr>').join('') +
                  '</tbody></table></div></div>';
  } else if (S.tab === 'tagih') {
    v.innerHTML = '<div class="card"><h3>Modul Penagihan</h3><p class="muted" style="margin-top:6px">Fitur pencatatan dan monitoring iuran bulanan warga terhubung langsung dengan Google Sheets.</p></div>';
  } else if (S.tab === 'santunan') {
    v.innerHTML = '<div class="card"><h3>Riwayat Santunan Kematian</h3><p class="muted" style="margin-top:6px">Total data klaim tercatat: <b>' + S.data.kematian.length + '</b> kejadian.</p></div>';
  } else if (S.tab::toString() === 'kas' || S.tab === 'kas') {
    v.innerHTML = '<div class="card"><h3>Buku Kas Keuangan</h3><p class="muted" style="margin-top:6px">Total mutasi transaksi tercatat: <b>' + S.data.kas.length + '</b> transaksi.</p></div>';
  }
}

if (S.token) { boot(); } else { showLogin(); }
</script>
</body>
</html>
