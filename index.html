<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f6f5c">
<title>Administrasi Serikat Kematian</title>
<style>
:root{--bg:#f3f7f5;--card:#fff;--text:#12281f;--muted:#5f7a6d;--line:#dfeae4;--pri:#0f6b4f;--pri2:#1f9a73;--h1:#07382a;--h2:#0f6b4f;--pri-soft:#e3f3ec;--onpri:#fff;--danger:#c8372d;--ok:#0f8a5f;--sh:0 2px 14px rgba(7,56,42,.08)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
h1,h2,h3{margin:0}
button,input,select{font:inherit;color:inherit}
header{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;padding:16px;border-radius:0 0 22px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
main{max-width:1100px;margin:0 auto;padding:16px 16px 100px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:var(--sh)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.stat small{color:var(--muted)}
.stat b{display:block;font-size:22px;margin-top:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end;margin-top:14px}
.row.between{justify-content:space-between}
button.primary,button.ghost,button.danger{border-radius:12px;padding:8px 16px;cursor:pointer;border:1px solid var(--pri);font-size:14px}
button.primary{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-color:transparent}
button.ghost{background:transparent;color:var(--pri)}
button.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 3px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;color:var(--muted)}
td.n,th.n{text-align:right}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;background:var(--pri-soft);color:var(--pri)}
.badge.off{background:var(--line);color:var(--muted)}
.in{color:var(--ok)}.out{color:var(--danger)}
.muted{color:var(--muted)}
.empty{padding:18px;text-align:center;color:var(--muted)}
.ferr{margin:10px 0 0;padding:8px;border-radius:8px;background:rgba(180,35,24,.12);color:var(--danger);font-size:14px}
.ferr:empty{display:none}
dialog{border:1px solid var(--line);border-radius:14px;padding:18px;width:min(520px,94vw);background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.45)}

#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--h1),var(--h2))}
.login-header{text-align:center;color:#fff;margin-bottom:20px}
.login-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;width:min(680px,100%)}
.login-card{background:var(--card);border-radius:20px;padding:20px;box-shadow:var(--sh);display:flex;flex-direction:column;justify-content:space-between}

#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.show{opacity:1}#toast.err{background:var(--danger);color:#fff}
#bar{position:fixed;top:0;left:0;height:3px;width:100%;background:var(--pri);z-index:30;display:none}
.hero{background:linear-gradient(135deg,var(--h1),var(--h2));border-radius:24px;padding:22px;color:#fff;margin-bottom:16px}
.hero b{display:block;font-size:32px;margin:2px 0 8px}
#bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);padding:6px;box-shadow:0 -6px 24px rgba(7,56,42,.1)}
#bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--muted);font-size:11px;padding:5px;cursor:pointer}
#bnav button.on{color:var(--pri);font-weight:600}
</style>
</head>
<body>
<div id="bar"></div>

<section id="login" hidden>
  <div class="login-header">
    <h2>Serikat Kematian</h2>
    <p>Silakan pilih jenis portal untuk masuk</p>
  </div>
  <div class="login-cards">
    <div class="login-card">
      <div>
        <h3>Portal Pengurus</h3>
        <p class="muted">Akses pengelolaan data anggota, iuran, kas, dan santunan.</p>
      </div>
      <button class="primary" data-act="openLoginAdmin" style="margin-top:16px">Masuk Pengurus</button>
    </div>
    <div class="login-card">
      <div>
        <h3>Portal Peserta</h3>
        <p class="muted">Cek status keanggotaan dan histori pembayaran iuran.</p>
      </div>
      <button class="ghost" data-act="openLoginPeserta" style="margin-top:16px">Masuk Peserta</button>
    </div>
  </div>
</section>

<div id="app" hidden>
  <header>
    <div><small id="roleLbl">Pengurus</small><h1 id="brand" style="font-size:18px">Serikat Kematian</h1></div>
    <button class="ghost" id="logoutBtn" data-act="logout" style="color:#fff;border-color:rgba(255,255,255,.3)">Keluar</button>
  </header>
  <main id="view"></main>
  <div id="bnav"></div>
</div>

<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwbtIzhauLLo_XhctBvnMcBlpPK2Q7G7fSuqOzF-fwZu2OhxeiAbifXKaQDBXXACte1/exec';

const S = { token: sessionStorage.getItem('tok'), role: sessionStorage.getItem('role') || 'admin', data: null, tab: 'dashboard' };

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = n => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n || 0);
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const thisMonth = () => today().slice(0, 7);
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const fmtPeriode = p => { if (!p) return '-'; const arr = String(p).split('-'); return BULAN[+arr[1] - 1] + ' ' + arr[0]; };
const fmtTgl = t => { if (!t) return '-'; const arr = String(t).split('T')[0].split('-'); return +arr[2] + ' ' + BULAN[+arr[1] - 1].slice(0, 3) + ' ' + arr[0]; };

function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', err ? 5000 : 2200);
}
const bar = on => { $('#bar').style.display = on ? 'block' : 'none'; };

const NAVS = [['dashboard', 'Beranda'], ['tagih', 'Tagih'], ['anggota', 'Anggota'], ['santunan', 'Santunan'], ['kas', 'Kas']];

async function api(action, payload) {
  if (!API_URL) throw new Error('API_URL belum diisi.');
  let res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, token: S.token }, payload || {})) });
  let j = await res.json();
  if (!j.ok) { if (j.code === 'AUTH') logout(); throw new Error(j.error || 'Terjadi kesalahan'); }
  return j;
}

document.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  
  if (act === 'openLoginAdmin') {
    const d = $('#dlg');
    d.innerHTML = `<h3>Login Pengurus</h3><p class="muted" style="margin:4px 0 12px">Masukkan password pengurus</p><form id="formAdmin"><label>Password</label><input id="pwAdmin" type="password" required><p class="ferr" id="errAdmin"></p><div class="row end" style="margin-top:16px"><button type="button" class="ghost" onclick="$('#dlg').close()">Batal</button><button class="primary" type="submit">Masuk</button></div></form>`;
    d.showModal();
    $('#pwAdmin').focus();
    $('#formAdmin').onsubmit = async ev => {
      ev.preventDefault();
      try {
        const j = await api('login', { password: $('#pwAdmin').value });
        S.token = j.token; S.role = 'admin';
        sessionStorage.setItem('tok', j.token); sessionStorage.setItem('role', 'admin');
        d.close(); boot();
      } catch (ex) { $('#errAdmin').textContent = ex.message; }
    };
  }
  
  if (act === 'openLoginPeserta') {
    const d = $('#dlg');
    d.innerHTML = `<h3>Login Peserta</h3><p class="muted" style="margin:4px 0 12px">Masukkan No. Induk / No. HP dan PIN</p><form id="formPeserta"><label>No. Induk / No. HP</label><input id="noPeserta" type="text" required><label>PIN (6 Digit)</label><input id="pinPeserta" type="password" required><p class="ferr" id="errPeserta"></p><div class="row end" style="margin-top:16px"><button type="button" class="ghost" onclick="$('#dlg').close()">Batal</button><button class="primary" type="submit">Masuk Portal</button></div></form>`;
    d.showModal();
    $('#noPeserta').focus();
    $('#formPeserta').onsubmit = async ev => {
      ev.preventDefault();
      try {
        const j = await api('memberLogin', { noInduk: $('#noPeserta').value, pin: $('#pinPeserta').value });
        S.token = j.token; S.role = 'peserta';
        sessionStorage.setItem('tok', j.token); sessionStorage.setItem('role', 'peserta');
        d.close(); boot();
      } catch (ex) { $('#errPeserta').textContent = ex.message; }
    };
  }

  if (act === 'logout') logout();
});

document.addEventListener('click', e => {
  const btn = e.target.closest('#bnav button[data-tab]');
  if (!btn) return;
  S.tab = btn.dataset.tab;
  document.querySelectorAll('#bnav button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  render();
});

function showLogin() { 
  sessionStorage.clear();
  $('#app').hidden = true; 
  $('#login').hidden = false; 
}

function logout() {
  showLogin();
}

async function boot() {
  bar(true);
  try {
    if (S.role === 'admin') {
      const j = await api('getAll'); 
      S.data = j.data; S.tab = 'dashboard';
      $('#bnav').innerHTML = NAVS.map(n => '<button data-tab="' + n[0] + '" class="' + (S.tab === n[0] ? 'on' : '') + '"><span>' + n[1] + '</span></button>').join('');
    } else {
      const j = await api('memberGet');
      S.data = j.data; S.tab = 'pesertaNav';
      $('#bnav').innerHTML = '<button data-tab="pesertaNav" class="on"><span>Status Saya</span></button>';
    }
    $('#login').hidden = true; $('#app').hidden = false;
    $('#roleLbl').textContent = S.role === 'admin' ? 'Pengurus' : 'Peserta';
    render();
  } catch (e) {
    toast(e.message, true);
    showLogin();
  } finally { bar(false); }
}

const iurBulanan = () => (S.data && S.data.pengaturan) ? +S.data.pengaturan.IuranBulanan : 0;
const saldoKas = () => (S.data && S.data.kas) ? S.data.kas.reduce((s, k) => s + (k.Jenis === 'Masuk' ? k.Jumlah : -k.Jumlah), 0) : 0;

function render() {
  const v = $('#view');
  if (!S.data) return;
  if (S.role === 'peserta') { v.innerHTML = `<div class="card"><h3>Halo, ${esc(S.data.nama)}</h3><p class="muted">Status: <b>${esc(S.data.status)}</b></p></div>`; return; }
  
  if (S.tab === 'dashboard') {
    v.innerHTML = `<div class="hero"><small>Saldo Kas</small><b>${rp(saldoKas())}</b></div><div class="card"><h3>Dashboard Pengurus Aktif</h3><p class="muted">Total Anggota: ${S.data.anggota.length}</p></div>`;
  } else if (S.tab === 'anggota') {
    v.innerHTML = `<div class="card"><h3>Daftar Anggota</h3><table><thead><tr><th>Nama</th><th>Status</th></tr></thead><tbody>${S.data.anggota.map(a => `<tr><td>${esc(a.Nama)}</td><td>${esc(a.Status)}</td></tr>`).join('')}</tbody></table></div>`;
  } else {
    v.innerHTML = `<div class="card"><h3>Menu ${S.tab}</h3><p class="muted">Fitur aktif.</p></div>`;
  }
}

if (S.token) {
  boot();
} else {
  showLogin();
}
</script>
</body>
</html>
