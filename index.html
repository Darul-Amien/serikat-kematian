<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f6f5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Administrasi Serikat Kematian</title>
<style>
:root{--bg:#f3f7f5;--card:#fff;--text:#12281f;--muted:#5f7a6d;--line:#dfeae4;--pri:#0f6b4f;--pri2:#1f9a73;--h1:#07382a;--h2:#0f6b4f;--pri-soft:#e3f3ec;--onpri:#fff;--danger:#c8372d;--ok:#0f8a5f;--warn:#b7791f;--sh:0 2px 14px rgba(7,56,42,.08);--ring:rgba(15,107,79,.25)}
@media (prefers-color-scheme:dark){:root{--bg:#0a1511;--card:#112019;--text:#e4f1ea;--muted:#8fa89b;--line:#1f3328;--pri:#3dc592;--pri2:#79dfb7;--h1:#06261c;--h2:#0d4a38;--pri-soft:#143327;--onpri:#04241a;--danger:#f2766b;--ok:#4fd8a0;--warn:#e8b04a;--sh:0 2px 14px rgba(0,0,0,.4);--ring:rgba(61,197,146,.3)}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
h1,h2,h3{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
header{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;padding:16px 16px 18px;border-radius:0 0 22px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5;box-shadow:0 4px 16px rgba(7,56,42,.25)}
header h1{font-size:19px}
header small{opacity:.85;font-size:12px;display:block}
.hbtn{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:12px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:16px 16px 100px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:var(--sh)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.stat small{color:var(--muted)}
.stat b{display:block;font-size:22px;margin-top:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end;margin-top:14px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:140px}
button.primary,button.ghost,button.danger,a.btn{border-radius:12px;padding:7px 14px;cursor:pointer;border:1px solid var(--pri);text-decoration:none;display:inline-block;font-size:14px}
button.primary{background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--onpri);border-color:transparent}
button.ghost,a.btn{background:transparent;color:var(--pri)}
button.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
button.sm,a.btn.sm{padding:3px 10px;font-size:13px}
button:disabled{opacity:.6;cursor:wait}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 3px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
tfoot td{font-weight:600}
.badge{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;background:var(--pri-soft);color:var(--pri)}
.badge.off{background:var(--line);color:var(--muted)}
.badge.bad{background:rgba(180,35,24,.12);color:var(--danger)}
.in{color:var(--ok)}.out{color:var(--danger)}
.muted{color:var(--muted)}
.empty{padding:18px;text-align:center;color:var(--muted)}
.ferr{margin:10px 0 0;padding:8px 10px;border-radius:8px;background:rgba(180,35,24,.12);color:var(--danger);font-size:14px}
.ferr:empty{display:none}
dialog{border:1px solid var(--line);border-radius:14px;padding:18px;width:min(520px,94vw);background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* DASHBOARD LOGIN DUA KARTU */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;background:linear-gradient(160deg,var(--h1),var(--h2))}
.login-header{text-align:center;color:#fff;margin-bottom:20px}
.login-header h2{font-size:22px;font-weight:700}
.login-header p{opacity:.85;font-size:13px;margin-top:4px}
.login-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;width:min(680px,100%)}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--sh);display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s,box-shadow .15s}
.login-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.15)}
.login-card-icon{width:48px;height:48px;border-radius:14px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;margin-bottom:12px}
.login-card h3{font-size:18px;margin-bottom:4px}
.login-card p{font-size:13px;color:var(--muted);margin:0 0 16px}
.logo-img{width:56px;height:56px;object-fit:cover;border-radius:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.2)}

#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:20}
#toast.show{opacity:1}#toast.err{background:var(--danger);color:#fff}
#bar{position:fixed;top:0;left:0;height:3px;width:100%;background:var(--pri);z-index:30;display:none;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.rpt h2{margin-bottom:2px}
.hero{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:0 8px 22px rgba(7,56,42,.28)}
.hero small{opacity:.85}.hero b{display:block;font-size:30px;margin:2px 0 8px}
.hero .hs{display:flex;gap:16px;font-size:13px;opacity:.92}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;margin-bottom:18px}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;cursor:pointer;font-size:12px;color:var(--text);padding:2px}
.tile .ti{width:56px;height:56px;border-radius:19px;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;color:var(--pri)}
.tile svg{width:26px;height:26px}
#bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(7,56,42,.1)}
#bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--muted);font-size:11px;padding:5px 0;cursor:pointer}
#bnav button.on{color:var(--pri);font-weight:600}
#bnav svg{width:24px;height:24px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.tg{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.tg .nm{font-weight:600;font-size:16px}
.tg .ln{margin:4px 0}
.tg .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tg .acts .primary{flex:1;min-width:150px}
button,a.btn,nav button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@media (max-width:640px){
 body{font-size:16px}
 input,select,textarea{font-size:16px;padding:11px 12px}
 button.primary,button.ghost,button.danger,a.btn{padding:11px 16px;font-size:15px}
 button.sm,a.btn.sm{padding:9px 13px;font-size:14px}
 main{padding:12px 12px 100px}
 .card{padding:14px}
 .grid{grid-template-columns:1fr 1fr}
 .stat b{font-size:19px}
 dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;padding:16px}
 th,td{padding:10px 8px}
}
@media print{header,#bnav,.noprint,#toast{display:none!important}body{background:#fff;color:#000}.card{border:none;padding:0}main{padding:0}}
h3{font-size:16px;font-weight:650}
.card,.stat{border-color:transparent}
.stat small{font-size:12px;color:var(--muted)}
header{border-radius:0 0 28px 28px}
.hero{background:radial-gradient(circle at 88% 12%,rgba(255,255,255,.16),transparent 42%),radial-gradient(circle at 6% 115%,rgba(255,255,255,.09),transparent 40%),linear-gradient(135deg,var(--h1),var(--h2));border-radius:24px;padding:22px 20px}
.hero b{font-size:32px;letter-spacing:-.01em}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--ring)}
button,a.btn{transition:transform .08s,box-shadow .15s}
button:active,a.btn:active{transform:scale(.97)}
button.primary{box-shadow:0 4px 12px rgba(7,56,42,.22)}
tbody tr:hover td{background:var(--pri-soft)}
.tile .ti{background:var(--pri-soft);box-shadow:none;border-radius:20px}
#bnav{border-top:0;box-shadow:0 -6px 24px rgba(7,56,42,.1)}
#bnav button.on svg{width:46px;height:30px;padding:3px 11px;box-sizing:border-box;background:var(--pri-soft);border-radius:999px}
.badge{font-weight:500}
</style>
</head>
<body>
<div id="bar"></div>

<!-- DASHBOARD LOGIN -->
<section id="login" hidden>
  <div class="login-header">
    <img src="logo-masjid.png" alt="Logo Masjid" class="logo-img" onerror="this.style.display='none'">
    <h2>Serikat Kematian</h2>
    <p>Silakan pilih jenis portal untuk masuk</p>
  </div>

  <div class="login-cards">
    <!-- Kartu Login Admin -->
    <div class="login-card">
      <div>
        <div class="login-card-icon">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <h3>Portal Pengurus</h3>
        <p>Akses pengelolaan data anggota, pencatatan iuran, kas, dan santunan.</p>
      </div>
      <button class="primary" data-act="openLoginAdmin">Masuk Pengurus</button>
    </div>

    <!-- Kartu Login Peserta -->
    <div class="login-card">
      <div>
        <div class="login-card-icon">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <h3>Portal Peserta</h3>
        <p>Cek status keanggotaan, histori pembayaran iuran, serta informasi santunan.</p>
      </div>
      <button class="ghost" data-act="openLoginPeserta">Masuk Peserta</button>
    </div>
  </div>
</section>

<!-- APP MAIN -->
<div id="app" hidden>
  <header>
    <div><small id="roleLbl">Pengurus</small><h1 id="brand">Serikat Kematian</h1></div>
    <button class="hbtn" id="logoutBtn" data-act="logout" aria-label="Keluar"></button>
  </header>
  <main id="view"></main>
  <div id="bnav"></div>
</div>

<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script>
/* ============ KONFIGURASI ============ */
const API_URL = 'https://script.google.com/macros/s/AKfycbwbtIzhauLLo_XhctBvnMcBlpPK2Q7G7fSuqOzF-fwZu2OhxeiAbifXKaQDBXXACte1/exec';

/* ============ STATE & HELPER ============ */
const S = { token: null, role: 'admin', data: null, tab: 'tagih', sid: '', f: {} };
try { 
  S.token = sessionStorage.getItem('tok'); 
  S.role = sessionStorage.getItem('role') || 'admin';
} catch (e) {}

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = n => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n || 0);
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const thisMonth = () => today().slice(0, 7);
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const fmtPeriode = p => { const [y, m] = String(p).split('-'); return BULAN[+m - 1] + ' ' + y; };
const fmtTgl = t => { if (!t) return '-'; const [y, m, d] = t.split('-'); return +d + ' ' + BULAN[+m - 1].slice(0, 3) + ' ' + y; };

S.f = { tq: '', sq: '', aq: '', ast: '', iq: '', iuranM: '', kasM: thisMonth(), rMode: 'bulan', rMonth: thisMonth(), rYear: today().slice(0, 4) };

function monthRange(from, to) {
  const out = []; let [y, m] = from.split('-').map(Number); const [ty, tm] = to.split('-').map(Number);
  while ((y < ty || (y === ty && m <= tm)) && out.length < 600) { out.push(y + '-' + pad(m)); m++; if (m > 12) { m = 1; y++; } }
  return out;
}

function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', err ? 5000 : 2200);
}
const bar = on => { $('#bar').style.display = on ? 'block' : 'none'; };

/* ============ IKON & NAVIGASI ============ */
const ICONS = {
  home: '<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
  wallet: '<rect x="2" y="6" width="20" height="13" rx="3"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 6V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.3c2.2.7 3.5 2.6 3.5 5.7"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  heart: '<path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3 5 6.4 5c2 0 3.5 1 5.6 3 2.1-2 3.6-3 5.6-3 3.4 0 5.2 3.6 3.9 6.8C19.5 16.4 12 21 12 21z"/>',
  book: '<path d="M4 4h12a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/><path d="M8 9h7M8 13h7"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>'
};
const ic = (n, sz) => '<svg viewBox="0 0 24 24" width="' + (sz || 24) + '" height="' + (sz || 24) + '" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[n] + '</svg>';
const NAVS = [['dashboard', 'Beranda', 'home'], ['tagih', 'Tagih', 'wallet'], ['anggota', 'Anggota', 'users'], ['santunan', 'Santunan', 'heart'], ['kas', 'Kas', 'book']];
const TILES = [['tagih', 'Tagih', 'wallet'], ['anggota', 'Anggota', 'users'], ['iuran', 'Iuran', 'calendar'], ['santunan', 'Santunan', 'heart'], ['kas', 'Kas', 'book'], ['laporan', 'Laporan', 'chart'], ['pengaturan', 'Pengaturan', 'gear']];

$('#logoutBtn').innerHTML = ic('logout', 20);

/* ============ API ============ */
async function api(action, payload) {
  if (!API_URL || API_URL.startsWith('GANTI')) throw new Error('API_URL belum diisi di index.html');
  let res;
  try {
    res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, token: S.token }, payload || {})) });
  } catch (e) {
    throw new Error('Tidak bisa terhubung ke server. Periksa koneksi internet.');
  }
  let j;
  try { j = await res.json(); } catch (e) {
    throw new Error('Respons server tidak valid.');
  }
  if (!j.ok) { if (j.code === 'AUTH') logout(); throw new Error(j.error || 'Terjadi kesalahan'); }
  return j;
}

/* ============ DIALOG MODAL LOGIN ============ */
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  
  if (act === 'openLoginAdmin') {
    const d = $('#dlg');
    d.innerHTML = `
      <h3>Login Pengurus</h3>
      <p class="muted" style="margin:4px 0 12px">Masukkan password pengurus</p>
      <form id="formAdmin">
        <label for="pwAdmin">Password</label>
        <input id="pwAdmin" type="password" required autocomplete="current-password">
        <p class="ferr" id="errAdmin" role="alert"></p>
        <div class="row end" style="margin-top:16px">
          <button type="button" class="ghost" onclick="$('#dlg').close()">Batal</button>
          <button class="primary" type="submit" id="btnSubmitAdmin">Masuk</button>
        </div>
      </form>`;
    d.showModal();
    $('#pwAdmin').focus();
    
    $('#formAdmin').onsubmit = async ev => {
      ev.preventDefault();
      const err = $('#errAdmin'), b = $('#btnSubmitAdmin');
      err.textContent = ''; b.disabled = true; bar(true);
      try {
        const j = await api('login', { password: $('#pwAdmin').value });
        S.token = j.token;
        S.role = 'admin';
        try { sessionStorage.setItem('tok', j.token); sessionStorage.setItem('role', 'admin'); } catch (e) {}
        d.close();
        await boot();
      } catch (ex) {
        err.textContent = ex.message;
      } finally { b.disabled = false; bar(false); }
    };
  }
  
  if (act === 'openLoginPeserta') {
    const d = $('#dlg');
    d.innerHTML = `
      <h3>Login Peserta</h3>
      <p class="muted" style="margin:4px 0 12px">Masukkan Nomor Induk / No. HP dan PIN Anda</p>
      <form id="formPeserta">
        <label for="noPeserta">No. Induk / No. HP</label>
        <input id="noPeserta" type="text" required placeholder="Contoh: 08123456789">
        <label for="pinPeserta">PIN</label>
        <input id="pinPeserta" type="password" required pattern="[0-9]*" inputmode="numeric" placeholder="6 digit PIN">
        <p class="ferr" id="errPeserta" role="alert"></p>
        <div class="row end" style="margin-top:16px">
          <button type="button" class="ghost" onclick="$('#dlg').close()">Batal</button>
          <button class="primary" type="submit" id="btnSubmitPeserta">Masuk Portal</button>
        </div>
      </form>`;
    d.showModal();
    $('#noPeserta').focus();
    
    $('#formPeserta').onsubmit = async ev => {
      ev.preventDefault();
      const err = $('#errPeserta'), b = $('#btnSubmitPeserta');
      err.textContent = ''; b.disabled = true; bar(true);
      try {
        const j = await api('loginPeserta', { id: $('#noPeserta').value, pin: $('#pinPeserta').value });
        S.token = j.token;
        S.role = 'peserta';
        try { sessionStorage.setItem('tok', j.token); sessionStorage.setItem('role', 'peserta'); } catch (e) {}
        d.close();
        await boot();
      } catch (ex) {
        err.textContent = ex.message;
      } finally { b.disabled = false; bar(false); }
    };
  }

  if (act === 'logout') logout();
});

/* ============ UTILS & NAVIGATION ============ */
function showLogin() { 
  $('#app').hidden = true; 
  $('#login').hidden = false; 
}

function logout() {
  S.token = null; S.data = null;
  try { sessionStorage.removeItem('tok'); sessionStorage.removeItem('role'); } catch (e) {}
  const d = $('#dlg'); if (d.open) d.close();
  showLogin();
}

async function boot() {
  bar(true);
  try {
    const j = await api('getAll'); 
    S.data = j.data;
    $('#login').hidden = true; 
    $('#app').hidden = false; 
    
    $('#roleLbl').textContent = S.role === 'admin' ? 'Pengurus' : 'Peserta';
    
    // Render Bottom Nav berdasarkan Role
    if (S.role === 'admin') {
      $('#bnav').innerHTML = NAVS.map(n => '<button data-tab="' + n[0] + '">' + ic(n[2]) + '<span>' + n[1] + '</span></button>').join('');
      S.tab = 'dashboard';
    } else {
      $('#bnav').innerHTML = '<button data-tab="pesertaNav">' + ic('users') + '<span>Status Saya</span></button>';
      S.tab = 'pesertaNav';
    }
    
    render();
  } catch (e) {
    toast(e.message, true);
    logout();
  } finally {
    bar(false);
  }
}

const iurBulanan = () => +S.data.pengaturan.IuranBulanan || 0;
const saldoKas = () => S.data.kas.reduce((s, k) => s + (k.Jenis === 'Masuk' ? k.Jumlah : -k.Jumlah), 0);
const cmpTgl = (a, b) => (b.Tanggal || '').localeCompare(a.Tanggal || '');
const KM = () => S.data.kematian || [], TG = () => S.data.tagihan || [];

function paidSet(id) { return new Set(S.data.iuran.filter(i => i.AnggotaID === id).map(i => i.Periode)); }

function tunggakan() {
  const nowM = thisMonth(), iur = iurBulanan();
  return S.data.anggota.filter(a => a.Status === 'Aktif').map(a => {
    const start = (a.TanggalMasuk || today()).slice(0, 7);
    const paid = paidSet(a.ID);
    const miss = start <= nowM ? monthRange(start, nowM).filter(p => !paid.has(p)) : [];
    return { a, miss, total: miss.length * iur };
  }).filter(x => x.miss.length);
}

function render() {
  const v = $('#view');
  if (S.role === 'peserta') {
    v.innerHTML = vPeserta();
    return;
  }
  
  if (S.tab === 'dashboard') v.innerHTML = vDash();
  else if (S.tab === 'anggota') v.innerHTML = vAnggota();
  else if (S.tab === 'kas') v.innerHTML = vKas();
  else v.innerHTML = vDash();
}

function vDash() {
  const d = S.data, aktif = d.anggota.filter(a => a.Status === 'Aktif');
  const terkumpul = d.iuran.filter(i => i.Periode === thisMonth()).reduce((s, i) => s + i.Jumlah, 0);
  const target = aktif.length * iurBulanan();
  const tg = tunggakan().sort((x, y) => y.miss.length - x.miss.length);
  const last = [...d.kas].sort(cmpTgl).slice(0, 6);
  return `<div class="hero"><small>Saldo kas</small><b>${rp(saldoKas())}</b><div class="hs"><span>${aktif.length} KK aktif</span></div></div>
  <div class="grid">
    <div class="stat"><small>Iuran ${esc(fmtPeriode(thisMonth()))}</small><b>${rp(terkumpul)}</b><small>target ${rp(target)}</small></div>
    <div class="stat"><small>Anggota menunggak</small><b>${tg.length}</b></div>
  </div>
  <div class="card"><div class="row between"><h3>Transaksi kas terakhir</h3></div>
  ${last.length ? `<div class="tw"><table><tbody>${last.map(k => `<tr><td>${esc(fmtTgl(k.Tanggal))}</td><td>${esc(k.Keterangan || k.Kategori)}</td><td class="n ${k.Jenis === 'Masuk' ? 'in' : 'out'}">${k.Jenis === 'Masuk' ? '+' : '−'}${rp(k.Jumlah)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Belum ada transaksi.</div>'}</div>`;
}

function vPeserta() {
  return `<div class="card">
    <h3>Selamat Datang di Portal Peserta</h3>
    <p class="muted">Fitur portal peserta akan menampilkan ringkasan iuran dan informasi keanggotaan Anda.</p>
  </div>`;
}

// Inisialisasi awal
if (S.token) boot();
else showLogin();
</script>
</body>
</html>
