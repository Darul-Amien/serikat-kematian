<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f6f5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Administrasi Serikat Kematian</title>
<style>
:root{--bg:#f3f7f5;--card:#fff;--text:#12281f;--muted:#5f7a6d;--line:#dfeae4;--pri:#0f6b4f;--pri2:#1f9a73;--h1:#07382a;--h2:#0f6b4f;--pri-soft:#e3f3ec;--onpri:#fff;--danger:#c8372d;--ok:#0f8a5f;--warn:#b7791f;--sh:0 2px 14px rgba(7,56,42,.08);--ring:rgba(15,107,79,.25)}
@media (prefers-color-scheme:dark){:root{--bg:#0a1511;--card:#112019;--text:#e4f1ea;--muted:#8fa89b;--line:#1f3328;--pri:#3dc592;--pri2:#79dfb7;--h1:#06261c;--h2:#0d4a38;--pri-soft:#143327;--onpri:#04241a;--danger:#f2766b;--ok:#4fd8a0;--warn:#e8b04a;--sh:0 2px 14px rgba(0,0,0,.4);--ring:rgba(61,197,146,.3)}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
h1,h2,h3{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
header{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;padding:16px 16px 18px;border-radius:0 0 22px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5;box-shadow:0 4px 16px rgba(7,56,42,.25)}
header h1{font-size:19px}
header small{opacity:.85;font-size:12px;display:block}
.hbtn{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:12px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:16px 16px 100px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:var(--sh)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.stat small{color:var(--muted)}
.stat b{display:block;font-size:22px;margin-top:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end;margin-top:14px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:140px}
button.primary,button.ghost,button.danger,a.btn{border-radius:12px;padding:7px 14px;cursor:pointer;border:1px solid var(--pri);text-decoration:none;display:inline-block;font-size:14px}
button.primary{background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--onpri);border-color:transparent}
button.ghost,a.btn{background:transparent;color:var(--pri)}
button.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
button.sm,a.btn.sm{padding:3px 10px;font-size:13px}
button:disabled{opacity:.6;cursor:wait}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 3px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
tfoot td{font-weight:600}
.badge{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;background:var(--pri-soft);color:var(--pri)}
.badge.off{background:var(--line);color:var(--muted)}
.badge.bad{background:rgba(180,35,24,.12);color:var(--danger)}
.in{color:var(--ok)}.out{color:var(--danger)}
.muted{color:var(--muted)}
.empty{padding:18px;text-align:center;color:var(--muted)}
.ferr{margin:10px 0 0;padding:8px 10px;border-radius:8px;background:rgba(180,35,24,.12);color:var(--danger);font-size:14px}
.ferr:empty{display:none}
dialog{border:1px solid var(--line);border-radius:14px;padding:18px;width:min(520px,94vw);background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#login{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,var(--h1),var(--h2))}
#login .card{width:min(380px,100%)}
.logo-img{width:52px;height:52px;object-fit:cover;border-radius:16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:20}
#toast.show{opacity:1}#toast.err{background:var(--danger);color:#fff}
#bar{position:fixed;top:0;left:0;height:3px;width:100%;background:var(--pri);z-index:30;display:none;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.rpt h2{margin-bottom:2px}
.hero{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:0 8px 22px rgba(7,56,42,.28)}
.hero small{opacity:.85}.hero b{display:block;font-size:30px;margin:2px 0 8px}
.hero .hs{display:flex;gap:16px;font-size:13px;opacity:.92}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;margin-bottom:18px}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;cursor:pointer;font-size:12px;color:var(--text);padding:2px}
.tile .ti{width:56px;height:56px;border-radius:19px;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;color:var(--pri)}
.tile svg{width:26px;height:26px}
#bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(7,56,42,.1)}
#bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--muted);font-size:11px;padding:5px 0;cursor:pointer}
#bnav button.on{color:var(--pri);font-weight:600}
#bnav svg{width:24px;height:24px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.tg{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.tg .nm{font-weight:600;font-size:16px}
.tg .ln{margin:4px 0}
.tg .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tg .acts .primary{flex:1;min-width:150px}
button,a.btn,nav button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@media (max-width:640px){
 body{font-size:16px}
 input,select,textarea{font-size:16px;padding:11px 12px}
 button.primary,button.ghost,button.danger,a.btn{padding:11px 16px;font-size:15px}
 button.sm,a.btn.sm{padding:9px 13px;font-size:14px}
 main{padding:12px 12px 100px}
 .card{padding:14px}
 .grid{grid-template-columns:1fr 1fr}
 .stat b{font-size:19px}
 dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;padding:16px}
 th,td{padding:10px 8px}
}
@media print{header,#bnav,.noprint,#toast{display:none!important}body{background:#fff;color:#000}.card{border:none;padding:0}main{padding:0}}
h3{font-size:16px;font-weight:650}
.card,.stat{border-color:transparent}
.stat small{font-size:12px;color:var(--muted)}
header{border-radius:0 0 28px 28px}
.hero{background:radial-gradient(circle at 88% 12%,rgba(255,255,255,.16),transparent 42%),radial-gradient(circle at 6% 115%,rgba(255,255,255,.09),transparent 40%),linear-gradient(135deg,var(--h1),var(--h2));border-radius:24px;padding:22px 20px}
.hero b{font-size:32px;letter-spacing:-.01em}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--ring)}
button,a.btn{transition:transform .08s,box-shadow .15s}
button:active,a.btn:active{transform:scale(.97)}
button.primary{box-shadow:0 4px 12px rgba(7,56,42,.22)}
tbody tr:hover td{background:var(--pri-soft)}
.tile .ti{background:var(--pri-soft);box-shadow:none;border-radius:20px}
#bnav{border-top:0;box-shadow:0 -6px 24px rgba(7,56,42,.1)}
#bnav button.on svg{width:46px;height:30px;padding:3px 11px;box-sizing:border-box;background:var(--pri-soft);border-radius:999px}
.badge{font-weight:500}
</style>
</head>
<body>
<div id="bar"></div>

<section id="login" hidden>
  <form class="card" id="loginForm">
    <img src="logo-masjid.png" alt="Logo Masjid" class="logo-img" onerror="this.style.display='none'">
    <h2>Masuk Pengurus</h2>
    <p class="muted" style="margin:4px 0 0">Administrasi serikat kematian</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <p class="ferr" id="lerr" role="alert"></p>
    <div class="row end"><button class="primary" type="submit" id="loginBtn">Masuk</button></div>
  </form>
</section>

<div id="app" hidden>
  <header>
    <div><small>Pengurus</small><h1 id="brand">Serikat Kematian</h1></div>
    <button class="hbtn" id="logoutBtn" data-act="logout" aria-label="Keluar"></button>
  </header>
  <main id="view"></main>
  <div id="bnav"></div>
</div>

<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script>
/* ============ KONFIGURASI ============ */
// Ganti dengan URL Web App hasil Deploy di Apps Script (berakhiran /exec)
const API_URL = 'https://script.google.com/macros/s/AKfycbwbtIzhauLLo_XhctBvnMcBlpPK2Q7G7fSuqOzF-fwZu2OhxeiAbifXKaQDBXXACte1/exec';

/* ============ STATE & HELPER ============ */
const S = { token: null, data: null, tab: 'tagih', sid: '', f: {} };
try { S.token = sessionStorage.getItem('tok'); } catch (e) {}

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = n => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n || 0);
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const thisMonth = () => today().slice(0, 7);
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const fmtPeriode = p => { const [y, m] = String(p).split('-'); return BULAN[+m - 1] + ' ' + y; };
const fmtTgl = t => { if (!t) return '-'; const [y, m, d] = t.split('-'); return +d + ' ' + BULAN[+m - 1].slice(0, 3) + ' ' + y; };

S.f = { tq: '', sq: '', aq: '', ast: '', iq: '', iuranM: '', kasM: thisMonth(), rMode: 'bulan', rMonth: thisMonth(), rYear: today().slice(0, 4) };

function monthRange(from, to) {
  const out = []; let [y, m] = from.split('-').map(Number); const [ty, tm] = to.split('-').map(Number);
  while ((y < ty || (y === ty && m <= tm)) && out.length < 600) { out.push(y + '-' + pad(m)); m++; if (m > 12) { m = 1; y++; } }
  return out;
}

function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', err ? 5000 : 2200);
}
const bar = on => { $('#bar').style.display = on ? 'block' : 'none'; };

/* ============ IKON & NAVIGASI ============ */
const ICONS = {
  home: '<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
  wallet: '<rect x="2" y="6" width="20" height="13" rx="3"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 6V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.3c2.2.7 3.5 2.6 3.5 5.7"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  heart: '<path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3 5 6.4 5c2 0 3.5 1 5.6 3 2.1-2 3.6-3 5.6-3 3.4 0 5.2 3.6 3.9 6.8C19.5 16.4 12 21 12 21z"/>',
  book: '<path d="M4 4h12a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/><path d="M8 9h7M8 13h7"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>'
};
const ic = (n, sz) => '<svg viewBox="0 0 24 24" width="' + (sz || 24) + '" height="' + (sz || 24) + '" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[n] + '</svg>';
const NAVS = [['dashboard', 'Beranda', 'home'], ['tagih', 'Tagih', 'wallet'], ['anggota', 'Anggota', 'users'], ['santunan', 'Santunan', 'heart'], ['kas', 'Kas', 'book']];
const TILES = [['tagih', 'Tagih', 'wallet'], ['anggota', 'Anggota', 'users'], ['iuran', 'Iuran', 'calendar'], ['santunan', 'Santunan', 'heart'], ['kas', 'Kas', 'book'], ['laporan', 'Laporan', 'chart'], ['pengaturan', 'Pengaturan', 'gear']];
$('#bnav').innerHTML = NAVS.map(n => '<button data-tab="' + n[0] + '">' + ic(n[2]) + '<span>' + n[1] + '</span></button>').join('');
$('#logoutBtn').innerHTML = ic('logout', 20);

/* ============ API ============ */
async function api(action, payload) {
  if (!API_URL || API_URL.startsWith('GANTI')) throw new Error('API_URL belum diisi di index.html');
  let res;
  try {
    // Tanpa header Content-Type -> "simple request", tidak memicu preflight CORS di Apps Script.
    res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, token: S.token }, payload || {})) });
  } catch (e) {
    throw new Error('Tidak bisa terhubung ke server. Periksa koneksi internet, API_URL, dan pastikan deployment Apps Script diset "Who has access: Anyone".');
  }
  let j;
  try { j = await res.json(); } catch (e) {
    throw new Error('Respons server tidak valid. Periksa deployment Apps Script (akses harus "Anyone") dan pastikan sudah deploy versi terbaru.');
  }
  if (!j.ok) { if (j.code === 'AUTH') logout(); throw new Error(j.error || 'Terjadi kesalahan'); }
  return j;
}
async function run(fn) { bar(true); try { await fn(); } catch (e) { toast(e.message, true); } finally { bar(false); } }
async function mutate(action, payload, msg) { const j = await api(action, payload); S.data = j.data; render(); toast(msg || 'Tersimpan'); }

/* ============ LOGIN ============ */
function showLogin() { $('#app').hidden = true; $('#login').hidden = false; $('#pw').value = ''; setTimeout(() => $('#pw').focus(), 50); }
function logout() {
  S.token = null; S.data = null;
  try { sessionStorage.removeItem('tok'); } catch (e) {}
  const d = $('#dlg'); if (d.open) d.close();
  showLogin();
}
$('#loginForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const btn = $('#loginBtn'), err = $('#lerr');
  err.textContent = ''; btn.disabled = true; bar(true);
  try {
    const j = await api('login', { password: $('#pw').value });
    S.token = j.token; try { sessionStorage.setItem('tok', j.token); } catch (e) {}
    await boot();
  } catch (e) {
    err.textContent = e.message;
  } finally { btn.disabled = false; bar(false); }
});
async function boot() {
  const j = await api('getAll'); S.data = j.data;
  $('#login').hidden = true; $('#app').hidden = false; render();
}

/* ============ PERHITUNGAN ============ */
const iurBulanan = () => +S.data.pengaturan.IuranBulanan || 0;
const nama = id => { const a = S.data.anggota.find(x => x.ID === id); return a ? a.Nama : '(dihapus)'; };
const saldoKas = () => S.data.kas.reduce((s, k) => s + (k.Jenis === 'Masuk' ? k.Jumlah : -k.Jumlah), 0);
const cmpTgl = (a, b) => (b.Tanggal || '').localeCompare(a.Tanggal || '');
const KM = () => S.data.kematian || [], TG = () => S.data.tagihan || [];
const almLine = id => { const l = KM().filter(k => k.AnggotaID === id); return l.length ? '<div class="muted">Almarhum: ' + l.map(k => esc(k.Almarhum) + ' (' + esc(fmtTgl(k.Tanggal)) + ')').join(', ') + '</div>' : ''; };
const jiwaAktif = () => S.data.anggota.filter(a => a.Status === 'Aktif').reduce((s, a) => s + (+a.Tanggungan || 0), 0);
const sumK = k => {
  const tg = TG().filter(t => t.KematianID === k.ID), paid = tg.filter(t => t.TanggalBayar);
  return { tg, n: tg.length, nPaid: paid.length, target: tg.reduce((s, t) => s + t.Jumlah, 0), terkumpul: paid.reduce((s, t) => s + t.Jumlah, 0), hapus: tg.filter(t => !t.TanggalBayar && t.Dihapuskan).reduce((s, t) => s + t.Jumlah, 0) };
};
// Santunan dihitung dari TOTAL TAGIHAN (bukan yang terkumpul). Kekurangan ditalangi kas.
const santunanOf = k => k.Status === 'Dicairkan' ? k.Santunan : Math.floor(sumK(k).target * (+k.Persen || 95) / 100);
// talangan = kekurangan kas yang masih bisa pulih dari tagihan yang belum dibayar; ditanggung = bagian yang sudah dihapuskan (permanen)
const talangan = k => { const m = sumK(k); return Math.min(Math.max(0, santunanOf(k) - m.terkumpul), m.target - m.terkumpul - m.hapus); };
const ditanggung = k => Math.max(0, santunanOf(k) - sumK(k).terkumpul) - talangan(k);
// Santunan lama (dicairkan berdasarkan yang terkumpul) tetap terkunci; yang baru (Mode = Target) boleh dibayar susulan.
const bisaBayar = k => k.Status !== 'Dicairkan' || k.Mode === 'Target';
// Pencairan boleh dibatalkan hanya bila belum ada tagihan dihapuskan dan belum ada pelunasan susulan.
const bisaBatalCair = k => k.Status === 'Dicairkan' && k.Mode === 'Target'
  && !TG().some(t => t.KematianID === k.ID && t.Dihapuskan)
  && !S.data.kas.some(c => TG().some(t => t.KematianID === k.ID && c.Referensi === 'T:' + t.ID));

function paidSet(id) { return new Set(S.data.iuran.filter(i => i.AnggotaID === id).map(i => i.Periode)); }

function tunggakan() {
  const nowM = thisMonth(), iur = iurBulanan();
  return S.data.anggota.filter(a => a.Status === 'Aktif').map(a => {
    const start = (a.TanggalMasuk || today()).slice(0, 7);
    const paid = paidSet(a.ID);
    const miss = start <= nowM ? monthRange(start, nowM).filter(p => !paid.has(p)) : [];
    return { a, miss, total: miss.length * iur };
  }).filter(x => x.miss.length);
}

// Gabungan tunggakan iuran + santunan per anggota
function tunggakanAll() {
  const base = new Map(tunggakan().map(x => [x.a.ID, x]));
  return S.data.anggota.map(a => {
    const b = base.get(a.ID) || { a, miss: [], total: 0 };
    const sant = TG().filter(t => t.AnggotaID === a.ID && !t.TanggalBayar && !t.Dihapuskan)
      .map(t => ({ t, k: KM().find(x => x.ID === t.KematianID) })).filter(x => x.k);
    return Object.assign({}, b, { sant, santTotal: sant.reduce((s, x) => s + x.t.Jumlah, 0) });
  }).filter(x => x.miss.length || x.sant.length).sort((x, y) => (y.total + y.santTotal) - (x.total + x.santTotal));
}

function santNote(id) {
  const x = tunggakanAll().find(y => y.a.ID === id);
  if (!x || !x.sant.length) return '';
  return '⚠ KK ini juga belum membayar santunan: ' + x.sant.map(s => esc(s.k.Almarhum) + ' (' + rp(s.t.Jumlah) + ')').join(', ') + '. Catat lewat tombol "Bayar santunan" di daftar tunggakan.';
}

function waLink(a, miss, sant) {
  let p = String(a.Telepon || '').replace(/\D/g, ''); if (!p) return '';
  if (p.startsWith('0')) p = '62' + p.slice(1);
  sant = sant || [];
  const parts = [];
  if (miss.length) {
    const shown = miss.length > 6 ? miss.slice(0, 6).map(fmtPeriode).join(', ') + ' dan ' + (miss.length - 6) + ' bulan lainnya' : miss.map(fmtPeriode).join(', ');
    parts.push('iuran ' + shown + ' (' + rp(miss.length * iurBulanan()) + ')');
  }
  if (sant.length) parts.push('santunan kematian ' + sant.map(s => s.k.Almarhum).join(', ') + ' (' + rp(sant.reduce((z, s) => z + s.t.Jumlah, 0)) + ')');
  const total = miss.length * iurBulanan() + sant.reduce((z, s) => z + s.t.Jumlah, 0);
  const msg = 'Yth. ' + a.Nama + ', kami informasikan yang belum tercatat di ' + S.data.pengaturan.NamaSerikat + ': ' + parts.join('; ') + '. Total ' + rp(total) + '. Terima kasih.';
  return 'https://wa.me/' + p + '?text=' + encodeURIComponent(msg);
}

/* ============ CSV ============ */
function csvCell(v) {
  v = String(v == null ? '' : v);
  // Cegah formula injection di Excel, tetapi nomor telepon (+62...) dibiarkan apa adanya.
  if (/^[=+\-@\t\r]/.test(v) && !/^\+?\d[\d\s.\-]*$/.test(v)) v = "'" + v;
  return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
function downloadCsv(name, rows) {
  const blob = new Blob(['\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ============ MODE TAGIH (HP) ============ */
function vTagih() {
  const q = S.f.tq.toLowerCase();
  const all = tunggakanAll();
  const L = all.filter(x => !q || (x.a.Nama + ' ' + x.a.Alamat).toLowerCase().includes(q));
  const total = all.reduce((s, x) => s + x.total + x.santTotal, 0);
  return `<div class="grid"><div class="stat"><small>Belum tertagih</small><b class="out">${rp(total)}</b><small>${all.length} KK</small></div>
  <div class="stat"><small>Saldo kas</small><b>${rp(saldoKas())}</b></div></div>
  <div class="card"><input data-f="tq" placeholder="Cari nama / alamat" value="${esc(S.f.tq)}" style="margin-bottom:12px">
  ${L.length ? L.map(x => { const w = waLink(x.a, x.miss, x.sant), tel = String(x.a.Telepon || '').replace(/[^\d+]/g, '');
    return `<div class="tg"><div class="row between"><span class="nm">${esc(x.a.Nama)}</span><b class="out">${rp(x.total + x.santTotal)}</b></div>${x.a.Alamat ? `<div class="muted">${esc(x.a.Alamat)}</div>` : ''}
    ${x.miss.length ? `<div class="ln">Iuran: <b>${x.miss.length} bulan</b> <span class="muted">(${esc(fmtPeriode(x.miss[0]))}${x.miss.length > 1 ? ' – ' + esc(fmtPeriode(x.miss[x.miss.length - 1])) : ''})</span></div>` : ''}
    ${x.sant.map(s => `<div class="ln">Santunan ${esc(s.k.Almarhum)}: <b>${rp(s.t.Jumlah)}</b></div>`).join('')}
    <div class="acts"><button class="primary" data-act="terima" data-id="${esc(x.a.ID)}">Terima bayar</button>
    ${w ? `<a class="btn" target="_blank" rel="noopener" href="${esc(w)}">WhatsApp</a>` : ''}${tel ? `<a class="btn" href="tel:${esc(tel)}">Telepon</a>` : ''}</div></div>`; }).join('')
    : `<div class="empty">${all.length ? 'Tidak ada yang cocok.' : 'Semua iuran dan santunan sudah lunas 🎉'}</div>`}</div>`;
}

function formTerima(id) {
  const x = tunggakanAll().find(y => y.a.ID === id); if (!x) return;
  const sant = x.sant.filter(s => bisaBayar(s.k)), iur = iurBulanan();
  openForm('Terima bayar · ' + x.a.Nama, `
    ${x.miss.length ? `<label>Iuran: bayar berapa bulan? (belum bayar ${x.miss.length} bulan)</label><input name="n" type="number" min="0" max="${x.miss.length}" value="${x.miss.length}" inputmode="numeric">` : ''}
    ${sant.map(s => `<label style="display:flex;gap:10px;align-items:center;color:var(--text);font-size:15px"><input type="checkbox" name="s_${esc(s.t.ID)}" checked style="width:auto"> Santunan ${esc(s.k.Almarhum)} ·${rp(s.t.Jumlah)}</label>`).join('')}
    <div class="two"><div><label>Tanggal bayar</label><input name="TanggalBayar" type="date" value="${today()}" required></div>
    <div><label>Metode</label><select name="Metode">${['Tunai', 'Transfer'].map(m => opt(m, 'Tunai')).join('')}</select></div></div>
    <p style="margin:12px 0 0;font-size:17px">Total diterima: <b id="qtot"></b></p>`,
    async v => {
      const n = x.miss.length ? Math.min(x.miss.length, Math.max(0, Math.floor(+v.n || 0))) : 0;
      const ids = sant.filter(s => v['s_' + s.t.ID]).map(s => s.t.ID);
      if (!n && !ids.length) throw new Error('Belum ada yang dipilih untuk dibayar.');
      const j = await api('terimaBayar', { row: { AnggotaID: id, Periodes: x.miss.slice(0, n), Jumlah: iur, TagihanIDs: ids, TanggalBayar: v.TanggalBayar, Metode: v.Metode, Catatan: '' } });
      S.data = j.data; render(); toast('Pembayaran ' + x.a.Nama + ' tercatat');
    },
    f => {
      const upd = () => {
        const n = f.elements.n ? Math.min(x.miss.length, Math.max(0, Math.floor(+f.elements.n.value || 0))) : 0;
        const tot = n * iur + sant.filter(s => f.elements['s_' + s.t.ID].checked).reduce((z, s) => z + s.t.Jumlah, 0);
        $('#qtot', f).textContent = rp(tot);
      };
      f.addEventListener('input', upd); upd();
    });
}

/* ============ FORM / DIALOG ============ */
function openForm(title, html, onSubmit, onReady) {
  const d = $('#dlg');
  d.innerHTML = `<form id="frm"><h3>${esc(title)}</h3>${html}<p class="ferr" id="ferr" role="alert"></p><div class="row end"><button type="button" class="ghost" data-act="closeDlg">Batal</button><button class="primary" type="submit">Simpan</button></div></form>`;
  const f = $('#frm', d);
  f.addEventListener('submit', async ev => {
    ev.preventDefault();
    const btn = $('.primary', f), err =$('#ferr', f);
    err.textContent = ''; btn.disabled = true; bar(true);
    try {
      await onSubmit(Object.fromEntries(new FormData(f)));
      d.close();
    } catch (e) {
      // Error ditampilkan di dalam dialog (toast tertutup oleh dialog modal).
      if (!S.token) toast(e.message, true); else err.textContent = e.message;
    } finally { btn.disabled = false; bar(false); }
  });
  if (onReady) onReady(f);
  d.showModal();
}

function formBayar(preId) {
  const aktif = S.data.anggota.filter(a => a.Status === 'Aktif').sort((a, b) => a.Nama.localeCompare(b.Nama));
  if (!aktif.length) return toast('Belum ada anggota aktif.', true);
  const firstUnpaid = id => {
    const a = S.data.anggota.find(x => x.ID === id); const paid = paidSet(id); const start = (a && a.TanggalMasuk || today()).slice(0, 7);
    return monthRange(start, thisMonth()).find(p => !paid.has(p)) || thisMonth();
  };
  const cur = preId || aktif[0].ID;
  openForm('Catat pembayaran iuran', `
    <label>Anggota</label><select name="AnggotaID">${aktif.map(a => opt(a.ID, cur, a.Nama)).join('')}</select>
    <p class="ferr" id="santNote" style="color:var(--warn);background:rgba(181,71,8,.12)">${santNote(cur)}</p>
    <div class="two"><div><label>Dari bulan</label><input name="dari" type="month" value="${firstUnpaid(cur)}" required></div>
    <div><label>Sampai bulan</label><input name="sampai" type="month" value="${thisMonth()}" required></div></div>
    <p class="muted" style="margin:6px 0 0">Bulan yang sudah lunas otomatis dilewati. Maksimal 60 bulan sekali input.</p>
    <div class="two"><div><label>Jumlah per bulan (Rp)</label><input name="Jumlah" type="number" min="1" value="${iurBulanan()}" required></div>
    <div><label>Tanggal bayar</label><input name="TanggalBayar" type="date" value="${today()}" required></div></div>
    <div class="two"><div><label>Metode</label><select name="Metode">${['Tunai', 'Transfer'].map(m => opt(m, 'Tunai')).join('')}</select></div>
    <div><label>Catatan</label><input name="Catatan" maxlength="300"></div></div>`,
    async v => {
      if (v.dari > v.sampai) throw new Error('"Dari bulan" tidak boleh setelah "Sampai bulan".');
      const paid = paidSet(v.AnggotaID);
      const periodes = monthRange(v.dari, v.sampai).filter(p => !paid.has(p));
      if (!periodes.length) throw new Error('Semua bulan pada rentang itu sudah lunas.');
      if (periodes.length > 60) throw new Error('Maksimal 60 bulan sekali input. Persempit rentang bulan, lalu ulangi untuk sisanya.');
      await mutate('saveIuranBatch', { row: { AnggotaID: v.AnggotaID, Periodes: periodes, Jumlah: v.Jumlah, TanggalBayar: v.TanggalBayar, Metode: v.Metode, Catatan: v.Catatan } }, periodes.length + ' bulan tercatat');
    },
    f => f.elements.AnggotaID.addEventListener('change', e => { f.elements.dari.value = firstUnpaid(e.target.value); $('#santNote', f).innerHTML = santNote(e.target.value); }));
}

/* ============ EVENT ============ */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act],[data-tab]'); if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; S.sid = ''; render(); window.scrollTo(0, 0); return; }
  const id = t.dataset.id;
  switch (t.dataset.act) {
    case 'logout': logout(); break;
    case 'closeDlg': $('#dlg').close(); break;
    case 'addAnggota': formAnggota(); break;
    case 'editAnggota': formAnggota(id); break;
    case 'delAnggota': if (confirm('Hapus anggota "' + nama(id) + '"?')) run(() => mutate('deleteAnggota', { id }, 'Anggota dihapus')); break;
    case 'randPin': { const i = document.querySelector('#frm [name="PINBaru"]'); if (i) i.value = String(crypto.getRandomValues(new Uint32Array(1))[0] % 1000000).padStart(6, '0'); break; }
    case 'terima': formTerima(id); break;
    case 'hapuskan': {
      const t = TG().find(x => x.ID === id);
      if (t && confirm('Hapuskan tagihan santunan ' + rp(t.Jumlah) + ' dari KK ' + nama(t.AnggotaID) + '?\nKas menanggung jumlah ini secara permanen dan tagihan tidak muncul lagi di daftar tunggakan. Bisa dibatalkan nanti.')) run(() => mutate('hapuskanTagihan', { row: { ID: id } }, 'Tagihan dihapuskan'));
      break;
    }
    case 'batalHapus': run(() => mutate('hapuskanTagihan', { row: { ID: id, Batal: true } }, 'Penghapusan dibatalkan')); break;
    case 'payIuran': formBayar(id); break;
    case 'editIuran': formIuran(id); break;
    case 'delIuran': if (confirm('Hapus pembayaran iuran ini? Catatan kas terkait ikut terhapus.')) run(() => mutate('deleteIuran', { id }, 'Iuran dihapus')); break;
    case 'addKas': formKas(null, t.dataset.jenis); break;
    case 'editKas': formKas(id); break;
    case 'delKas': if (confirm('Hapus transaksi kas ini?')) run(() => mutate('deleteKas', { id }, 'Transaksi dihapus')); break;
    case 'exportKematian':
      downloadCsv('riwayat-kematian.csv', [['Tanggal', 'Almarhum', 'KK', 'Catatan', 'Status', 'TanggalCair', 'Santunan', 'BagianKas']].concat([...KM()].sort(cmpTgl).map(k => [k.Tanggal, k.Almarhum, nama(k.AnggotaID), k.Catatan, k.Status, k.TanggalCair, k.Santunan, k.BagianKas]))); break;
    case 'openSantunan': S.tab = 'santunan'; S.sid = id; render(); window.scrollTo(0, 0); break;
    case 'backSantunan': S.sid = ''; render(); break;
    case 'addKematian': formKematian(); break;
    case 'lunas': formLunas(id); break;
    case 'batalLunas': run(() => mutate('bayarTagihan', { row: { ID: id, Batal: true } }, 'Pembayaran dibatalkan')); break;
    case 'cairkan': {
      const k = KM().find(x => x.ID === id), m = sumK(k), sant = santunanOf(k), tal = talangan(k);
      let msg = 'Cairkan santunan ' + rp(sant) + ' untuk keluarga ' + k.Almarhum + '?\n' + (m.n - m.nPaid) + ' KK belum bayar.';
      if (tal > 0) {
        msg += '\n\nKas akan menalangi ' + rp(tal) + ' (saldo kas saat ini ' + rp(saldoKas()) + ').';
        if (tal > saldoKas()) msg += '\n⚠ SALDO KAS TIDAK CUKUP untuk menalangi.';
        msg += '\nTagihan yang belum lunas tetap bisa dicatat setelah ini dan akan memulihkan kas.';
      }
      const kurang = tal > saldoKas();
      if (kurang) msg += '\nLanjutkan walau kas menjadi minus?';
      if (confirm(msg)) run(() => mutate('cairkanSantunan', { id, paksa: kurang }, 'Santunan dicairkan'));
      break;
    }
    case 'batalCairkan': if (confirm('Batalkan pencairan santunan ini?\nCatatan kas otomatis (talangan / bagian kas) akan dihapus dan status kembali "Berjalan". Gunakan hanya untuk mengoreksi salah klik.')) run(() => mutate('batalCairkan', { id }, 'Pencairan dibatalkan')); break;
    case 'delKematian': if (confirm('Batalkan pencatatan kematian ini? Jumlah jiwa KK dikembalikan dan semua tagihan dihapus.')) { run(() => mutate('deleteKematian', { id }, 'Pencatatan dibatalkan').then(() => { S.sid = ''; render(); })); } break;
    case 'kasSemua': S.f.kasM = ''; render(); break;
    case 'print': window.print(); break;
    case 'lihatLog': run(async () => {
      const j = await api('getLog'), d = $('#dlg');
      d.style.width = 'min(900px,96vw)';
      d.addEventListener('close', () => { d.style.width = ''; }, { once: true });
      d.innerHTML = '<h3>Log aktivitas</h3><div class="tw" style="margin-top:8px"><table><thead><tr><th>Waktu</th><th>Aksi</th><th>Ringkasan</th></tr></thead><tbody>' +
        (j.data.length ? j.data.map(l => '<tr><td style="white-space:nowrap">' + esc(l.Waktu) + '</td><td>' + esc(l.Aksi) + '</td><td class="muted" style="word-break:break-word">' + esc(l.Ringkasan) + '</td></tr>').join('') : '<tr><td colspan="3" class="empty">Belum ada aktivitas.</td></tr>') +
        '</tbody></table></div><div class="row end"><button class="ghost" data-act="closeDlg">Tutup</button></div>';
      d.showModal();
    }); break;
    case 'exportAnggota':
      downloadCsv('anggota.csv', [['Nama', 'NoInduk', 'Alamat', 'Telepon', 'TanggalMasuk', 'Status', 'Tanggungan', 'Catatan']].concat(S.data.anggota.map(a => [a.Nama, a.NoInduk, a.Alamat, a.Telepon, a.TanggalMasuk, a.Status, a.Tanggungan, a.Catatan]))); break;
    case 'exportKas':
      downloadCsv('kas.csv', [['Tanggal', 'Jenis', 'Kategori', 'Keterangan', 'Jumlah']].concat([...S.data.kas].sort(cmpTgl).map(k => [k.Tanggal, k.Jenis, k.Kategori, k.Keterangan, k.Jumlah]))); break;
  }
});

// Filter / pencarian: render ulang tanpa kehilangan fokus input
document.addEventListener('input', ev => {
  const key = ev.target.dataset && ev.target.dataset.f; if (!key) return;
  S.f[key] = ev.target.value;
  const pos = ev.target.selectionStart; render();
  const el = $('[data-f="' + key + '"]');
  if (el && ev.target.type !== 'month' && ev.target.tagName !== 'SELECT') { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} }
});

document.addEventListener('submit', ev => {
  if (ev.target.id !== 'setForm') return;
  ev.preventDefault();
  run(() => mutate('savePengaturan', { row: Object.fromEntries(new FormData(ev.target)) }, 'Pengaturan tersimpan'));
});

/* ============ MULAI ============ */
if (S.token) run(boot).then(() => { if (!S.data) showLogin(); }); else showLogin();
</script>
</body>
</html>
